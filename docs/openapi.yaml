      summary: Cambiar nombre, recargo, polígono o activarla/desactivarla
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonaInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zona' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: eliminarZona
      tags: [Configuración]
      summary: Eliminar zona
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NotFound' }

