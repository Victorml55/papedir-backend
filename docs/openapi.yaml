      summary: Buscar usuarios, tiendas y repartidores
      description: Las cuentas eliminadas solo aparecen si se filtra `estado = eliminado`.
      parameters:
        - name: rol
          in: query
          schema: { $ref: '#/components/schemas/Rol' }
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoCuenta' }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /soporte/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerSoporteUsuario
      tags: [Soporte]
      summary: Ficha completa de una cuenta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioDetalle' }
        '404': { $ref: '#/components/responses/NotFound' }

  /soporte/usuarios/{id}/eventos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarEventosCuenta
      tags: [Soporte]
      summary: Bitácora de la cuenta (registro, aprobación, baneos, bloqueos, cambios de contraseña…)
      description: Los 200 eventos más recientes, del más nuevo al más viejo.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoCuenta' }

  /soporte/usuarios/{id}/documentos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: documentosDeUsuario
      tags: [Soporte]
      summary: Documentos subidos por una cuenta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }

    post:
      operationId: documentoANombre
      tags: [Panel]
      summary: Subir un documento a nombre de una tienda o repartidor
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, archivo]
              properties:
                tipo: { type: string, description: Tipo del catálogo de documentos }
                aprobar: { type: string, enum: ['true', 'false'], description: true = queda aprobado al subirlo }
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/documentos/{id}/archivo:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: enlaceDocumento
      tags: [Soporte]
      summary: Enlace temporal para ver el archivo de un documento
      description: El enlace vence en 10 minutos; pide uno nuevo cada vez que se abra el documento.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, description: 'URL firmada (en desarrollo, un data: URL)' }
                  expiraEn: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

