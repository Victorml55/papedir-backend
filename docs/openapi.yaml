    post:
      operationId: revisarDocumento
      tags: [Soporte]
      summary: Aprobar o rechazar un documento
      description: Al rechazar, `motivo` es obligatorio; el usuario lo ve y recibe una notificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprobado]
              properties:
                aprobado: { type: boolean }
                motivo: { type: string, maxLength: 500, example: La foto está borrosa }
      responses:
        '200':
          description: Revisado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '400': { $ref: '#/components/responses/ValidationError' }

