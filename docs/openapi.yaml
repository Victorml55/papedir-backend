    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: desbloquearUsuario
      tags: [Soporte]
      summary: Quitar el bloqueo por intentos fallidos de login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioDetalle' }
        '409':
