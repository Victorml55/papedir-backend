      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        '204': { description: Dada de baja }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TIENE_PEDIDOS_ACTIVOS o TIENDA_ELIMINADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/tiendas/{id}/restaurar:
    parameters:
