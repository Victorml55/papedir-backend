      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                comisionPct: { type: number, nullable: true, minimum: 0, maximum: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  tiendaId: { type: string, format: uuid }
                  comisionPct: { type: number, nullable: true }
                  general: { type: number }

