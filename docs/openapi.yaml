            schema: { $ref: '#/components/schemas/Comisiones' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comisiones' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/configuracion/cartera:
    put:
      operationId: guardarCartera
