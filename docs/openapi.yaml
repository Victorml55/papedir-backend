      tags: [Admin]
      summary: Deshacer la baja de una tienda
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaTienda' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TIENDA_ACTIVA o LIMITE_SUCURSALES
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

