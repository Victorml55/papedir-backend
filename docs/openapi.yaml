      description: La cuenta sigue pendiente para que corrija; ve el motivo en `motivoRechazo` de /auth/me y le llega un push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500, example: La foto de la licencia está borrosa }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409':
          description: La cuenta no está pendiente de aprobación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/usuarios/{id}/aprobar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aprobarUsuario
      tags: [Soporte]
      summary: Aprobar una tienda o repartidor pendiente
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409':
          description: La cuenta no está pendiente de aprobación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/usuarios/{id}/banear:
    parameters:
