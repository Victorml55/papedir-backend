    post:
      operationId: desbanearUsuario
      tags: [Soporte]
      summary: Quitar baneo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }

  # ─────────────────────────── ADMIN (web) ───────────────────────────
  /admin/usuarios:
    post:
      operationId: crearUsuarioInterno
      tags: [Admin]
      summary: Crear cuentas del equipo, clientes o repartidores
      description: Nacen activas y con el correo verificado; clientes y repartidores aceptan los términos al entrar. Las tiendas se crean con POST /admin/tiendas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password, rol]
              properties:
                nombre: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                rol:
                  type: string
                  enum: [soporte, admin, cliente, repartidor]
                telefono: { type: string, pattern: '^[0-9]{10}$', description: Obligatorio para cliente y repartidor }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }

  /admin/cancelaciones:
    get:
      operationId: metricasCancelaciones
      tags: [Admin]
      summary: Motivos de cancelación y rechazo (soporte y admin)
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  desde: { type: string, format: date }
                  hasta: { type: string, format: date }
                  motivos:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo: { type: string }
                        texto: { type: string }
                        cancelados: { type: integer }
                        rechazados: { type: integer }

  /admin/zonas:
    get:
      operationId: listarZonas
      tags: [Configuración]
      summary: Todas las zonas de cobertura
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: '#/components/schemas/Zona' }
    post:
      operationId: crearZona
      tags: [Configuración]
      summary: Crear zona de cobertura
      description: |
        En cuanto hay al menos una zona activa, solo se entrega en destinos dentro de alguna (`FUERA_DE_COBERTURA`).
        `recargo` se suma al envío de los destinos de esa zona.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonaInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zona' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/zonas/{id}:
    parameters:
