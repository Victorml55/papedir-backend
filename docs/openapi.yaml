      summary: Quién le debe a PaPedir y a quién le debe PaPedir
      parameters:
        - name: rol
          in: query
          schema: { type: string, enum: [cliente, tienda, repartidor] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPorCobrar: { type: number, description: Suma de lo que deben (carteras negativas) }
                  totalPorPagar: { type: number, description: Suma de los saldos a favor (carteras positivas) }
                  usuarios:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        nombre: { type: string }
                        rol: { $ref: '#/components/schemas/Rol' }
                        saldo: { type: number }
                        ultimoMovimiento: { type: string, format: date-time }

  /admin/usuarios/{id}/saldo:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: saldoDeUsuario
      tags: [Finanzas]
      summary: Cartera de una cuenta (soporte y admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeCuenta' }

  /admin/liquidaciones:
    get:
      operationId: listarLiquidaciones
      tags: [Finanzas]
      summary: Pagos registrados
      parameters:
        - name: usuarioId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Liquidacion' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
    post:
      operationId: registrarLiquidacion
      tags: [Finanzas]
      summary: Registrar un pago entre PaPedir y una tienda o repartidor
      description: "`cobro`: el usuario le paga a PaPedir (baja su saldo). `pago`: PaPedir le paga al usuario (sube su saldo)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiquidacionInput' }
      responses:
        '201':
          description: Registrada
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: '#/components/schemas/Liquidacion'
                  - type: object
                    properties:
                      saldo: { type: number, description: Saldo después del pago }
        '400': { $ref: '#/components/responses/ValidationError' }

  /admin/metricas:
    get:
      operationId: obtenerAdminMetricas
      tags: [Admin]
      summary: Métricas generales para el dashboard
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pedidosTotales: { type: integer, example: 320 }
                  pedidosEntregados: { type: integer, example: 298 }
                  pedidosCancelados: { type: integer, example: 22 }
                  ventasTotales: { type: number, example: 48250.5 }
                  tiendasActivas: { type: integer, example: 14 }
                  repartidoresActivos: { type: integer, example: 9 }
                  ticketsAbiertos: { type: integer, example: 3 }

  /soporte/tablero:
    get:
      operationId: obtenerTablero
      tags: [Soporte]
      summary: Resumen de inicio del panel, con alertas
      description: >-
        Cifras del momento y alertas de lo que necesita atención: pedidos listos con más de 15 min sin repartidor,
        pedidos que la tienda no ha aceptado en 3 min, reembolsos fallidos y tickets con más de 30 min sin atender.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }

  /soporte/tiendas:
    get:
      operationId: listarTiendasPanel
      tags: [Soporte]
      summary: Todas las tiendas, con dueño, plan, estado y ventas de los últimos 30 días
      parameters:
        - { name: q, in: query, description: 'Tienda, dueño o correo', schema: { type: string, maxLength: 60 } }
        - { name: estado, in: query, description: Estado de la cuenta del dueño, schema: { $ref: '#/components/schemas/EstadoCuenta' } }
        - { name: plan, in: query, schema: { type: string, enum: [basico, pro, premium] } }
        - { name: abierta, in: query, description: Si recibe pedidos ahora, schema: { type: string, enum: [si, no] } }
        - { name: eliminadas, in: query, description: 'si = solo las dadas de baja (por omisión no aparecen)', schema: { type: string, enum: [si, no] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TiendaPanel' } }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /soporte/tiendas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerTiendaPanel
      tags: [Soporte]
      summary: Ficha completa de una tienda
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaTienda' }
        '404': { $ref: '#/components/responses/NotFound' }

  /soporte/tiendas/{id}/pausa:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: pausarTienda
      tags: [Soporte]
      summary: Pausar o reanudar una tienda sin banear la cuenta
      description: Con `minutos` > 0 deja de recibir pedidos hasta esa hora; con 0 quita la pausa. Se le avisa al dueño.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutos, motivo]
              properties:
                minutos: { type: integer, minimum: 0, maximum: 4320, example: 60 }
                motivo: { type: string, maxLength: 500, example: Varias quejas por pedidos incompletos }
      responses:
        '200':
          description: La ficha actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaTienda' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/repartidores:
    get:
      operationId: listarRepartidoresPanel
      tags: [Soporte]
      summary: Repartidores con conexión, vehículo, entregas de hoy y saldo
      parameters:
        - { name: q, in: query, description: 'Nombre, correo, teléfono o placa', schema: { type: string, maxLength: 60 } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoCuenta' } }
        - { name: conectado, in: query, description: Disponible y con ubicación de los últimos 5 min, schema: { type: string, enum: [si, no] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RepartidorPanel' } }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /soporte/mapa:
    get:
      operationId: obtenerMapaDespacho
      tags: [Soporte]
      summary: Mapa de despacho en vivo
      description: >-
        Repartidores conectados o en viaje, pedidos activos y tiendas que reciben pedidos. Después, la sala `soporte`
        recibe `mapa:repartidor` con cada ubicación nueva y `pedido:actualizado` con cada cambio.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapaDespacho' }

  /soporte/resenas:
    get:
      operationId: listarResenasPanel
      tags: [Soporte]
      summary: Todas las reseñas, para moderarlas
      parameters:
        - { name: q, in: query, description: 'Comentario, tienda o cliente', schema: { type: string, maxLength: 60 } }
        - { name: estrellas, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: ocultas, in: query, schema: { type: string, enum: [si, no] } }
        - { name: tiendaId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ResenaPanel' } }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /soporte/resenas/{pedidoId}:
    parameters:
      - { name: pedidoId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: moderarResena
      tags: [Soporte]
      summary: Ocultar o volver a mostrar el texto de una reseña
      description: Una reseña oculta conserva sus estrellas en el promedio, pero el público ya no ve su comentario ni la respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oculta]
              properties:
                oculta: { type: boolean }
                motivo: { type: string, maxLength: 500, description: Obligatorio al ocultar, example: Lenguaje ofensivo }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResenaPanel' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: editarUsuarioAdmin
      tags: [Admin]
      summary: Corregir los datos de una cuenta
      description: El rol solo se cambia entre soporte y admin. Cambiar correo o rol cierra sus sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, maxLength: 80 }
                telefono: { type: string, pattern: '^[0-9]{10}$' }
                email: { type: string, format: email }
                rol: { type: string, enum: [soporte, admin] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { description: '`EMAIL_EN_USO`, `ULTIMO_ADMIN` o `CUENTA_ELIMINADA`' }
    delete:
      operationId: eliminarUsuarioAdmin
      tags: [Admin]
      summary: Eliminar una cuenta (anonimiza sus datos)
      description: Igual que cuando el usuario elimina su cuenta; sus pedidos y pagos se conservan sin datos personales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        '204': { description: Eliminada }
        '409': { description: '`TIENE_PEDIDOS_ACTIVOS`, `ULTIMO_ADMIN` o `CUENTA_ELIMINADA`' }

  /admin/usuarios/{id}/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: fijarPasswordAdmin
      tags: [Admin]
      summary: Poner una contraseña temporal y cerrar sus sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '204': { description: Lista }
        '409': { description: '`CUENTA_SOCIAL`: entra con Google o GitHub' }

  /admin/metricas/series:
    get:
      operationId: obtenerSeriesMetricas
      tags: [Admin]
      summary: Series para las gráficas de métricas
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesMetricas' }

  /admin/notificaciones:
    post:
      operationId: enviarNotificacionGeneral
      tags: [Admin]
      summary: Enviar una notificación push general
      description: >-
        `tema`: a un tema de FCM (novedades, promociones, tiendas, repartidores). `rol`: a todas las cuentas activas de
        un rol; también queda en su bandeja de notificaciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destino, titulo, cuerpo]
              properties:
                destino: { type: string, enum: [tema, rol] }
                tema: { type: string, enum: [novedades, promociones, tiendas, repartidores] }
                rol: { type: string, enum: [cliente, tienda, repartidor] }
                titulo: { type: string, maxLength: 65, example: Hoy envío gratis }
                cuerpo: { type: string, maxLength: 240, example: Usa el cupón ENVIOGRATIS en compras desde $150 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [destino, modo]
                properties:
                  destino: { type: string, enum: [tema, rol] }
                  tema: { type: string }
                  rol: { type: string }
                  destinatarios: { type: integer }
                  modo: { type: string, enum: [enviada, simulada], description: '`simulada`: la API no tiene Firebase configurado' }

    get:
      operationId: historialPush
      tags: [Admin]
      summary: Notificaciones generales enviadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EnvioPush' } }, meta: { $ref: '#/components/schemas/PaginaMeta' } } }

  /admin/bitacora:
    get:
      operationId: listarBitacoraAdmin
      tags: [Admin]
      summary: Acciones del equipo de soporte y admin
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AccionInterna' } }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TiendaSel:
      name: X-Tienda-Id
      in: header
      required: false
      description: Sucursal con la que se trabaja (rol tienda). Sin header, la primera sucursal del dueño.
      schema: { type: string, format: uuid }
    Desde:
      name: desde
      in: query
      description: YYYY-MM-DD (hora de Celaya). Por defecto, 6 días antes de `hasta`.
      schema: { type: string, format: date, example: '2026-11-01' }
    Hasta:
      name: hasta
      in: query
      description: YYYY-MM-DD (hora de Celaya), incluido. Por defecto, hoy.
      schema: { type: string, format: date, example: '2026-11-07' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Lat:
      name: lat
      in: query
      schema: { type: number, example: 20.5222 }
    Lng:
      name: lng
      in: query
      schema: { type: number, example: -100.8123 }
    LatRequerida:
      name: lat
      in: query
      required: true
      schema: { type: number, example: 20.5222 }
    LngRequerida:
      name: lng
      in: query
      required: true
      schema: { type: number, example: -100.8123 }

  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado. La app debe intentar /auth/refresh una vez.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El rol no tiene permiso, la app no corresponde al rol o la cuenta está baneada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TransicionInvalida:
      description: El pedido no está en un estado que permita esta acción (`TRANSICION_INVALIDA`) o el repartidor está fuera de la geocerca (`FUERA_DE_RANGO`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── Comunes ──
    Error:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer, example: 409 }
        error:
          type: string
          description: |
            Código estable para que las apps decidan qué mostrar:
            VALIDACION, NO_AUTENTICADO, SIN_PERMISO, APP_INCORRECTA, CUENTA_BANEADA, CUENTA_PENDIENTE,
            NO_ENCONTRADO, EMAIL_REGISTRADO, TRANSICION_INVALIDA, FUERA_DE_RANGO, FUERA_DE_COBERTURA,
            TIENDA_CERRADA, PRODUCTO_AGOTADO, PEDIDO_MINIMO, PEDIDO_MAXIMO_EFECTIVO, PEDIDO_YA_TOMADO,
            VIAJE_LLENO, NO_ENCADENABLE, VIAJE_ACTIVO, CODIGO_INCORRECTO, TICKET_DUPLICADO, CALIFICACION_INVALIDA,
            REPARTIDOR_DESCONECTADO, CATEGORIA_CON_PRODUCTOS, TICKET_CERRADO, DEMASIADAS_PETICIONES, ERROR_INTERNO,
            CUENTA_BLOQUEADA, CODIGO_INVALIDO, PASSWORD_INCORRECTA, CORREO_YA_VERIFICADO, VERSION_TERMINOS,
            TIENE_PEDIDOS_ACTIVOS, ULTIMO_ADMIN, LIMITE_SUCURSALES, DOCUMENTO_APROBADO, DOCUMENTOS_INCOMPLETOS,
            CUPON_INVALIDO, CUPON_DUPLICADO, CHAT_CERRADO, CORREO_NO_VERIFICADO, REGISTRO_REQUERIDO, CUENTA_FIREBASE,
            FOTO_DEL_PROVEEDOR, FIREBASE_NO_CONFIGURADO, PAGOS_NO_CONFIGURADO, PAGO_PENDIENTE, PAGO_NO_COINCIDE,
            PAGO_USADO, PAGO_RECHAZADO, PAGO_INVALIDO
          example: PEDIDO_YA_TOMADO
        message: { type: string, example: El pedido ya fue tomado por otro repartidor }
        detalles:
          type: array
          description: Errores por campo (solo en validación)
          items:
            type: object
            properties:
              campo: { type: string, example: email }
              mensaje: { type: string, example: email debe ser un correo válido }

    PaginaMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 57 }

    Coordenadas:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 20.5222 }
        lng: { type: number, minimum: -180, maximum: 180, example: -100.8123 }

    MotivoRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, maxLength: 500, example: El cliente no respondió }

    MarcaRequest:
      type: object
      required: [ubicacion]
      properties:
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    EntregaRequest:
      type: object
      required: [ubicacion]
      properties:
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        codigoEntrega:
          type: string
          pattern: '^[0-9]{4}$'
          description: Obligatorio en pedidos de la app; 409 CODIGO_INCORRECTO si no coincide. No aplica en manuales.
          example: '4821'
        evidenciaUrl:
          type: string
          nullable: true
          description: Foto opcional subida con /uploads (tipo evidencia)

    CalificacionInput:
      type: object
      required: [tienda, repartidor]
      properties:
        tienda: { type: integer, minimum: 1, maximum: 5, example: 5 }
        repartidor: { type: integer, minimum: 1, maximum: 5, example: 4 }
        comentario: { type: string, maxLength: 300, nullable: true }

    Calificacion:
      allOf:
        - $ref: '#/components/schemas/CalificacionInput'
        - type: object
          properties:
            creadoEn: { type: string, format: date-time }

    EstadoCuenta:
      type: string
      description: |
        Tiendas y repartidores nacen en pendiente_aprobacion; clientes en activo.
        `eliminado` = el usuario borró su cuenta (solo lo ve soporte).
      enum: [pendiente_aprobacion, activo, baneado, eliminado]

    MetodoPago:
      type: string
      description: efectivo (al recibir) o tarjeta (Stripe; se paga antes de crear el pedido)
      enum: [efectivo, tarjeta]

    App:
      type: string
      enum: [cliente, tienda, repartidor, web]

    Rol:
      type: string
      enum: [cliente, tienda, repartidor, soporte, admin]

    # ── Auth / usuarios ──
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Ana López }
        email: { type: string, format: email, example: ana@correo.com }
        telefono: { type: string, nullable: true, example: '4611234567' }
        rol: { $ref: '#/components/schemas/Rol' }
        estado: { $ref: '#/components/schemas/EstadoCuenta' }
        fotoUrl: { type: string, nullable: true }
        emailVerificado: { type: boolean }
        terminosPendientes:
          type: boolean
          description: true si no ha aceptado la versión vigente de los términos; la app debe pedirlo
        calificacion:
          type: number
          nullable: true
          description: Solo repartidores, promedio de 1 a 5
          example: 4.8
        proveedor:
          type: string
          example: google.com
          description: local (correo de PaPedir), password (correo de Firebase), google.com, github.com
        puedeCambiarFoto:
          type: boolean
          description: Solo las cuentas de correo; las de Google o GitHub usan la foto del proveedor
        motivoRechazo: { type: string, nullable: true, description: 'Cuenta pendiente que soporte regresó: qué debe corregir. Se limpia al aprobarla' }
        rechazadaEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }

    UsuarioDetalle:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            motivoBaneo: { type: string, nullable: true }
            bloqueadoHasta:
              type: string
              format: date-time
              nullable: true
              description: Fin del bloqueo por intentos fallidos; null si no está bloqueada
            eliminadoEn: { type: string, format: date-time, nullable: true }
            terminosVersion: { type: string, nullable: true }
            terminosAceptadosEn: { type: string, format: date-time, nullable: true }
            tiendas:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  abierta: { type: boolean }
            vehiculo:
              allOf: [{ $ref: '#/components/schemas/Vehiculo' }]
              nullable: true
              type: object
            documentosCompletos:
              type: boolean
              nullable: true
              description: Repartidor y tienda; true si sus documentos requeridos están aprobados
            disponible: { type: boolean, nullable: true, description: 'Repartidor: si está conectado ahora' }

    EventoCuenta:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          description: |
            registrada, creada_por_admin, aprobada, baneada, desbaneada, bloqueada, desbloqueada,
            password_cambiada, password_restablecida, correo_verificado, terminos_aceptados, eliminada,
            documento_aprobado, documento_rechazado, ligada_firebase
          example: bloqueada
        actorId: { type: string, format: uuid, nullable: true, description: Quién lo hizo; null si fue el sistema }
        actorRol:
          type: string
          nullable: true
          enum: [cliente, tienda, repartidor, soporte, admin, null]
        detalle: { type: string, nullable: true }
        creadoEn: { type: string, format: date-time }

    Legal:
      type: object
      properties:
        version: { type: string, example: '2026-11' }
        avisoPrivacidadUrl: { type: string, example: 'https://papedir-frontend.vercel.app/privacidad' }
        terminosUrl: { type: string, example: 'https://papedir-frontend.vercel.app/terminos' }

    CodigoRequest:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^[0-9]{6}$', example: '482913' }

    ConfirmarPasswordRequest:
      type: object
      description: La contraseña o, en cuentas que entran con Firebase, un ID token de esa misma cuenta
      properties:
        password: { type: string }
        idToken: { type: string }

    LoginFirebaseRequest:
      type: object
      required: [idToken, app]
      properties:
        idToken: { type: string, description: ID token de Firebase Authentication }
        app:
          type: string
          enum: [cliente, tienda, repartidor]
        registro:
          type: object
          description: Solo la primera vez (después de un 404 REGISTRO_REQUERIDO)
          required: [telefono, aceptoTerminos]
          properties:
            nombre: { type: string, description: 'Si se omite, el de la cuenta de Google o GitHub' }
            telefono: { type: string, example: '4611234567' }
            aceptoTerminos: { type: boolean, enum: [true] }
            tienda: { $ref: '#/components/schemas/RegisterRequest/properties/tienda' }

    Tokens:
      type: object
      properties:
        accessToken: { type: string, description: Expira en 15 min }
        refreshToken: { type: string, description: Expira en 7 días }

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          properties:
            usuario: { $ref: '#/components/schemas/Usuario' }

    RegisterRequest:
      type: object
      required: [nombre, email, password, telefono, rol, aceptoTerminos]
      properties:
        nombre: { type: string, example: Ana López }
        email: { type: string, format: email, example: ana@correo.com }
        password: { type: string, minLength: 8, example: PaPedir123! }
        telefono: { type: string, example: '4611234567' }
        rol:
          type: string
          enum: [cliente, tienda, repartidor]
        aceptoTerminos:
          type: boolean
          enum: [true]
          description: El usuario aceptó el aviso de privacidad y los términos vigentes
        tienda:
          type: object
          description: Obligatorio si rol = tienda
          required: [nombre, categoria, direccion, ubicacion]
          properties:
            nombre: { type: string, example: Tacos Don Pepe }
            categoria: { $ref: '#/components/schemas/CategoriaTienda' }
            direccion: { type: string }
            ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    LoginRequest:
      type: object
      required: [email, password, app]
      properties:
        email: { type: string, format: email, example: cliente@papedir.test }
        password: { type: string, example: PaPedir123! }
        app: { $ref: '#/components/schemas/App' }

    # ── Direcciones ──
    DireccionInput:
      type: object
      required: [alias, texto, ubicacion]
      properties:
        alias: { type: string, example: Casa }
        texto: { type: string, example: 'Av. Tecnológico 1500, Celaya, Gto.' }
        referencias: { type: string, nullable: true, example: Portón negro }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    Direccion:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/DireccionInput'

    # ── Tiendas / productos ──
    CategoriaTienda:
      type: string
      example: comida
      description: 'Código del catálogo de categorías (GET /catalogos). Base: comida, abarrotes, farmacia, materiales, otros; admin puede agregar más.'

    Tienda:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Tacos Don Pepe }
        categoria: { $ref: '#/components/schemas/CategoriaTienda' }
        descripcion: { type: string, nullable: true }
        imagenUrl: { type: string, nullable: true }
        telefono: { type: string, nullable: true, example: '4615550000' }
        direccion: { type: string, example: 'Calle Hidalgo 120, Celaya' }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        abierta: { type: boolean, example: true, description: Interruptor general que maneja la tienda }
        abiertaAhora:
          type: boolean
          description: Recibe pedidos en este momento (abierta, sin pausa y dentro de su horario). Lo que debe mostrar la app.
        pausadaHasta: { type: string, format: date-time, nullable: true }
        usarHorario: { type: boolean }
        plan:
          type: string
          enum: [basico, pro, premium]
          description: Plan vigente. Las tiendas Premium aparecen primero en la búsqueda
        tiempoPreparacionMin: { type: integer, example: 20 }
        calificacion: { type: number, nullable: true, minimum: 1, maximum: 5, example: 4.7 }
        distanciaKm:
          type: number
          nullable: true
          description: Solo si se buscó con lat/lng
          example: 1.4

    TiendaUpdate:
      type: object
      properties:
        nombre: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaTienda' }
        descripcion: { type: string }
        imagenUrl: { type: string }
        telefono: { type: string }
        direccion: { type: string }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        abierta:
          type: boolean
          description: Una tienda pendiente de aprobación no puede abrir (409 CUENTA_PENDIENTE)
        tiempoPreparacionMin: { type: integer, minimum: 5, maximum: 120 }

    SolicitudTienda:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente, aprobada, rechazada, cancelada] }
        datos:
          type: object
          description: Lo que pidió el dueño (mismos campos que SucursalInput)
          additionalProperties: true
          properties:
            nombre: { type: string }
            categoria: { $ref: '#/components/schemas/CategoriaTienda' }
            descripcion: { type: string, nullable: true }
            imagenUrl: { type: string, nullable: true }
            telefono: { type: string, nullable: true }
            direccion: { type: string }
            ubicacion: { $ref: '#/components/schemas/Coordenadas' }
            tiempoPreparacionMin: { type: integer }
        motivo: { type: string, nullable: true, description: Por qué se rechazó }
        tiendaId: { type: string, format: uuid, nullable: true, description: La tienda creada al aprobarla }
        revisadaEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }
        dueno:
          type: object
          nullable: true
          description: Solo en el listado de soporte
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            email: { type: string }
            telefono: { type: string, nullable: true }

    SucursalInput:
      type: object
      required: [nombre, categoria, direccion, ubicacion]
      properties:
        nombre: { type: string, maxLength: 80, example: Tacos Don Pepe Norte }
        categoria: { $ref: '#/components/schemas/CategoriaTienda' }
        descripcion: { type: string }
        telefono: { type: string, example: '4615550000' }
        direccion: { type: string }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        tiempoPreparacionMin: { type: integer, minimum: 5, maximum: 120 }
        imagenUrl: { type: string, maxLength: 500 }
        copiarMenuDe: { type: string, format: uuid, description: Id de otra sucursal propia }

    TiendaAdminInput:
      type: object
      required: [nombre, categoria, direccion, ubicacion]
      description: Envía duenoId (cuenta de tienda existente) o dueno (cuenta nueva).
      properties:
        duenoId: { type: string, format: uuid }
        dueno:
          type: object
          required: [nombre, email, telefono, password]
          properties:
            nombre: { type: string, maxLength: 80 }
            email: { type: string, format: email }
            telefono: { type: string, pattern: '^[0-9]{10}$' }
            password: { type: string, minLength: 8, maxLength: 72, description: Contraseña temporal para compartir con el dueño }
        nombre: { type: string, maxLength: 80, example: Tacos Don Pepe }
        categoria: { $ref: '#/components/schemas/CategoriaTienda' }
        descripcion: { type: string, maxLength: 300 }
        imagenUrl: { type: string, maxLength: 500 }
        telefono: { type: string, pattern: '^[0-9]{10}$' }
        direccion: { type: string, maxLength: 200 }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        tiempoPreparacionMin: { type: integer, minimum: 5, maximum: 120 }

    Turno:
      type: object
      required: [dia, abre, cierra]
      properties:
        dia: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo … 6 = sábado' }
        abre: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00' }
        cierra: { type: string, example: '22:00', description: '"24:00" = medianoche' }

    Horario:
      type: object
      properties:
        usarHorario: { type: boolean }
        turnos:
          type: array
          items: { $ref: '#/components/schemas/Turno' }
        abiertaAhora: { type: boolean }

    ReporteVentas:
      type: object
      properties:
        tiendaId: { type: string, format: uuid }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        resumen:
          type: object
          properties:
            pedidosEntregados: { type: integer }
            pedidosManuales: { type: integer }
            cancelados: { type: integer }
            rechazados: { type: integer }
            enCurso: { type: integer }
            ventas: { type: number, example: 4250.5, description: Lo que cobró al repartidor (productos menos sus cupones) }
            descuentosCupones: { type: number, description: Cupones de la tienda }
            comisionPlataforma: { type: number }
            ventasNetas: { type: number, description: ventas − comisión }
            ticketPromedio: { type: number, example: 152.3 }
            calificacionPromedio: { type: number, nullable: true }
            calificaciones: { type: integer }
        porDia:
          type: array
          items:
            type: object
            properties:
              fecha: { type: string, format: date }
              pedidos: { type: integer }
              ventas: { type: number }
        porHora:
          type: array
          description: Pedidos entregados por hora del día (0-23); para ver las horas pico
          items:
            type: object
            properties:
              hora: { type: integer, minimum: 0, maximum: 23 }
              pedidos: { type: integer }
        productosMasVendidos:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              productoId: { type: string, format: uuid }
              nombre: { type: string }
              cantidad: { type: integer }
              importe: { type: number }

    CategoriaProductoInput:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 40, example: Tacos }
        orden: { type: integer, minimum: 0, example: 1 }

    CategoriaProducto:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/CategoriaProductoInput'

    MenuCategoria:
      type: object
      properties:
        categoria: { $ref: '#/components/schemas/CategoriaProducto' }
        productos:
          type: array
          items: { $ref: '#/components/schemas/Producto' }

    ProductoInput:
      type: object
      required: [categoriaId, nombre, precio]
      properties:
        categoriaId: { type: string, format: uuid }
        nombre: { type: string, example: Orden de pastor }
        descripcion: { type: string, nullable: true, example: 5 tacos con piña }
        precio: { type: number, minimum: 0, example: 85.0 }
        imagenUrl: { type: string, nullable: true, description: Foto principal; si mandas `imagenes` se toma la primera }
        imagenes:
          type: array
          maxItems: 5
          items: { type: string }
          description: Hasta 5 fotos (URLs de POST /uploads); la primera es la principal
        disponible:
          type: boolean
          default: true
          description: false = la tienda lo marcó agotado
        stock:
          type: integer
          nullable: true
          minimum: 0
          description: |
            Existencias. null = sin control de inventario. Baja al crear un pedido y regresa si se cancela o rechaza.
            En 0 el producto queda agotado.

    Producto:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            tiendaId: { type: string, format: uuid }
            agotado: { type: boolean, description: '`!disponible` o `stock = 0`. Lo que deben usar las apps para mostrar "Agotado".' }
            grupos:
              type: array
              items: { $ref: '#/components/schemas/GrupoOpciones' }
        - $ref: '#/components/schemas/ProductoInput'

    GrupoOpcionesInput:
      type: object
      required: [nombre, minimo, maximo, opciones]
      properties:
        nombre: { type: string, maxLength: 40, example: Salsa }
        minimo: { type: integer, minimum: 0, example: 1, description: 0 = opcional }
        maximo: { type: integer, minimum: 1, example: 1 }
        opciones:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [nombre]
            properties:
              nombre: { type: string, maxLength: 60, example: Verde }
              precioExtra: { type: number, minimum: 0, default: 0 }
              disponible: { type: boolean, default: true }

    GrupoOpciones:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Extras }
        minimo: { type: integer, example: 0 }
        maximo: { type: integer, example: 3 }
        opciones:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string, example: Queso }
              precioExtra: { type: number, example: 15 }
              disponible: { type: boolean }

    # ── Pedidos ──
    EstadoPedido:
      type: string
      description: |
        (programado →) creado → aceptado_tienda → listo_para_recoger → asignado → en_tienda
        → en_camino → en_domicilio → entregado.
        Finales: entregado, cancelado, rechazado.
        `programado`: pedido para más tarde; llega a la tienda (pasa a `creado`) con la anticipación necesaria.
      enum:
        - programado
        - creado
        - aceptado_tienda
        - listo_para_recoger
        - asignado
        - en_tienda
        - en_camino
        - en_domicilio
        - entregado
        - cancelado
        - rechazado

    CotizarPedidoRequest:
      type: object
      required: [tiendaId, direccionId, items]
      properties:
        tiendaId: { type: string, format: uuid }
        direccionId: { type: string, format: uuid }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        cupon: { type: string, example: BIENVENIDA, description: Código de cupón (mayúsculas o minúsculas) }
        propina: { type: number, minimum: 0, maximum: 500, example: 20, description: Para el repartidor; se cobra en efectivo con el total }
        programadoPara:
          type: string
          format: date-time
          description: Pedido programado. Hora de entrega deseada, de 45 minutos a 7 días a partir de ahora
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: integer, minimum: 1, example: 2 }
              opciones:
                type: array
                description: |
                  Ids de las opciones elegidas. Deben cumplir el mínimo y máximo de cada grupo del producto.
                  El mismo producto con opciones distintas va en elementos separados.
                items: { type: string, format: uuid }

    Cotizacion:
      type: object
      description: |
        Envío = $25 hasta 2 km + $7 por km adicional o fracción, más recargos (zona, horario nocturno, lluvia, alta demanda).
        Distancia = línea recta tienda → destino × 1.3. Cobertura máxima 8 km y, si hay zonas activas, dentro de una zona.
        Un cupón inválido responde 409 `CUPON_INVALIDO` con el motivo en `message`.
      properties:
        distanciaKm: { type: number, example: 4.42 }
        subtotal: { type: number, example: 170.0 }
        costoEnvio: { type: number, example: 46.0, description: Incluye los recargos }
        recargos:
          type: array
          items: { $ref: '#/components/schemas/Recargo' }
        descuento: { type: number, example: 30.0 }
        cupon:
          type: object
          nullable: true
          properties:
            codigo: { type: string }
            descripcion: { type: string, nullable: true }
        propina: { type: number, example: 20.0 }
        saldoAplicado: { type: number, example: 0, description: Saldo a favor de la cartera que se descontó solo }
        deudaCobrada: { type: number, example: 0, description: Adeudo anterior del cliente que se sumó al total }
        total: { type: number, example: 206.0, description: subtotal + costoEnvio + propina − descuento − saldoAplicado + deudaCobrada }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        programadoPara: { type: string, format: date-time, nullable: true }
        tiempoEstimadoMin:
          type: integer
          description: Preparación de la tienda + traslado estimado
          example: 35

    CrearPedidoRequest:
      type: object
      required: [tiendaId, direccionId, items]
      properties:
        tiendaId: { type: string, format: uuid }
        direccionId: { type: string, format: uuid }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        notas: { type: string, nullable: true, example: Sin cebolla }
        paymentIntentId:
          type: string
          example: pi_3QxYz...
          description: Obligatorio con metodoPago = tarjeta. El de POST /pagos/intento, ya confirmado en la app con flutter_stripe
        cupon: { type: string, example: BIENVENIDA, description: Código de cupón (mayúsculas o minúsculas) }
        propina: { type: number, minimum: 0, maximum: 500, example: 20, description: Para el repartidor; se cobra en efectivo con el total }
        programadoPara:
          type: string
          format: date-time
          description: Pedido programado. Hora de entrega deseada, de 45 minutos a 7 días a partir de ahora
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: integer, minimum: 1, example: 2 }
              opciones:
                type: array
                description: |
                  Ids de las opciones elegidas. Deben cumplir el mínimo y máximo de cada grupo del producto.
                  El mismo producto con opciones distintas va en elementos separados.
                items: { type: string, format: uuid }

    PedidoManualRequest:
      type: object
      required: [destino, descripcion, montoACobrar]
      properties:
        destino: { $ref: '#/components/schemas/DestinoInput' }
        descripcion: { type: string, example: 1 paquete de ropa }
        montoACobrar:
          type: number
          minimum: 0
          description: Monto de la mercancía a cobrar al destinatario (0 si ya está pagado). El envío se suma aparte.
          example: 350.0
        notas: { type: string, nullable: true }

    Destino:
      type: object
      required: [nombre, telefono, direccion, ubicacion]
      properties:
        nombre: { type: string, example: Luis Hernández }
        telefono: { type: string, nullable: true, example: '4619876543', description: null cuando el pedido ya terminó o quien consulta no debe verlo }
        direccion: { type: string, example: 'Av. Irrigación 300, Celaya' }
        referencias: { type: string, nullable: true }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    DestinoInput:
      type: object
      required: [nombre, telefono, direccion, ubicacion]
      properties:
        nombre: { type: string, maxLength: 80, example: Luis Hernández }
        telefono: { type: string, pattern: '^[0-9]{10}$', example: '4619876543' }
        direccion: { type: string, maxLength: 200, example: 'Av. Irrigación 300, Celaya' }
        referencias: { type: string, maxLength: 200, nullable: true }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    TiendaResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Tacos Don Pepe }
        telefono: { type: string, nullable: true, example: '4615550000', description: null cuando el pedido ya terminó o quien consulta no debe verlo }
        direccion: { type: string }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    RepartidorResumen:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Carlos Ruiz }
        telefono: { type: string, nullable: true, example: '4611112233' }
        ubicacion:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Coordenadas'
        fotoUrl: { type: string, nullable: true }
        calificacion: { type: number, nullable: true, example: 4.8 }
        vehiculo:
          allOf: [{ $ref: '#/components/schemas/Vehiculo' }]
          nullable: true
          type: object

    PedidoItem:
      type: object
      properties:
        productoId: { type: string, format: uuid }
        nombre: { type: string, example: Orden de pastor }
        cantidad: { type: integer, example: 2 }
        precioUnitario: { type: number, example: 100.0, description: Precio del producto + extras de las opciones }
        opciones:
          type: array
          description: Copia de las opciones elegidas al crear el pedido
          items:
            type: object
            properties:
              grupo: { type: string, example: Extras }
              nombre: { type: string, example: Queso }
              precioExtra: { type: number, example: 15 }
        importe: { type: number, example: 170.0 }

    Pedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: R-000123 }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        origen:
          type: string
          enum: [app, manual]
        tienda: { $ref: '#/components/schemas/TiendaResumen' }
        clienteId: { type: string, format: uuid, nullable: true }
        destino: { $ref: '#/components/schemas/Destino' }
        descripcion:
          type: string
          nullable: true
          description: Solo pedidos manuales
        items:
          type: array
          description: Vacío en pedidos manuales
          items: { $ref: '#/components/schemas/PedidoItem' }
        subtotal:
          type: number
          description: Productos (o montoACobrar en pedidos manuales)
          example: 170.0
        costoEnvio: { type: number, example: 46.0 }
        recargos:
          type: array
          items: { $ref: '#/components/schemas/Recargo' }
        propina: { type: number, example: 0 }
        descuento: { type: number, example: 0 }
        saldoAplicado: { type: number, example: 0, description: Saldo de la cartera del cliente usado en el pedido }
        deudaCobrada: { type: number, example: 0, description: Adeudo anterior del cliente cobrado en el pedido }
        total: { type: number, example: 216.0 }
        distanciaKm: { type: number, example: 4.42 }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        pagoEstado:
          type: string
          nullable: true
          enum: [pagado, reembolsado, reembolso_fallido, null]
          description: Solo con tarjeta. Si se cancela o rechaza se reembolsa solo
        montoAPagarTienda:
          type: number
          description: |
            Efectivo que el repartidor entrega a la tienda al recoger (subtotal menos el cupón si lo da la tienda).
            0 si se pagó con tarjeta (PaPedir le paga a la tienda en su liquidación)
          example: 170.0
        comisionTienda:
          type: number
          nullable: true
          description: Comisión de PaPedir (al entregarse). Solo la ven la tienda, soporte y admin
        grupoId: { type: string, format: uuid, nullable: true, description: Pedidos del mismo carrito de varias tiendas }
        programadoPara: { type: string, format: date-time, nullable: true }
        motivoCancelacion: { type: string, nullable: true, description: Código del catálogo si se canceló o rechazó }
        cancelacion:
          type: object
          nullable: true
          description: Solo para el cliente. Si puede cancelar ahora y cuánto le costaría (cancelación tardía en efectivo)
          properties:
            permitida: { type: boolean }
            cargo: { type: number, example: 25 }
        codigoEntrega:
          type: string
          nullable: true
          description: 4 dígitos. Solo viene en la respuesta para el cliente dueño del pedido; null en manuales
          example: '4821'
        calificacion:
          allOf:
            - $ref: '#/components/schemas/Calificacion'
          nullable: true
          type: object
        notas: { type: string, nullable: true }
        repartidor: { $ref: '#/components/schemas/RepartidorResumen' }
        etaMin:
          type: integer
          nullable: true
          description: |
            Minutos aproximados para que llegue al cliente (preparación, posición del repartidor y distancia).
            0 en el domicilio; null si el pedido ya terminó.
        viajeId: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    EventoPedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum:
            - creado
            - enviado_a_tienda
            - aceptado_tienda
            - rechazado
            - listo_para_recoger
            - asignado
            - llegada_tienda
            - salida_tienda
            - llegada_cliente
            - entregado
            - cancelado
            - ubicacion_corregida
            - completado_por_soporte
            - liberado_por_soporte
            - cancelado_automatico
            - reembolsado
            - reembolso_fallido
            - calificado
        usuarioId: { type: string, format: uuid }
        rol: { $ref: '#/components/schemas/Rol' }
        detalle: { type: string, nullable: true }
        ubicacion:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Coordenadas'
        creadoEn: { type: string, format: date-time }

    PedidoDisponible:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: R-000124 }
        tienda: { $ref: '#/components/schemas/TiendaResumen' }
        destinoUbicacion: { $ref: '#/components/schemas/Coordenadas' }
        destinoDireccion: { type: string }
        distanciaATiendaKm: { type: number, example: 0.8 }
        distanciaEntregaKm: { type: number, example: 2.3 }
        costoEnvio:
          type: number
          description: Ganancia del repartidor por este pedido
          example: 46.0
        propina: { type: number, example: 0 }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        montoAPagarTienda: { type: number, example: 170.0, description: 0 si se pagó con tarjeta }
        totalACobrar:
          type: number
          description: Efectivo a cobrar en el domicilio
          example: 216.0

    Tablero:
      type: object
      required: [pedidosEnCurso, pedidosProgramados, pedidosHoy, ventasHoy, ventasAyerMismaHora, ticketsSinAtender, ticketsEnAtencion, cuentasPorAprobar, documentosPorRevisar, repartidoresConectados, tiendasAbiertas, porEstado, alertas]
      properties:
        pedidosEnCurso: { type: integer }
        pedidosProgramados: { type: integer }
        pedidosHoy: { type: integer }
        ventasHoy: { type: number }
        ventasAyerMismaHora: { type: number, description: Ventas de ayer hasta esta misma hora }
        ticketsSinAtender: { type: integer }
        ticketsEnAtencion: { type: integer }
        cuentasPorAprobar: { type: integer }
        documentosPorRevisar: { type: integer }
        repartidoresConectados: { type: integer }
        tiendasAbiertas: { type: integer }
        porEstado:
          type: array
          items:
            type: object
            required: [estado, total]
            properties:
              estado: { $ref: '#/components/schemas/EstadoPedido' }
              total: { type: integer }
        alertas:
          type: array
          items:
            type: object
            required: [tipo, folio, desde]
            properties:
              tipo: { type: string, enum: [sin_repartidor, tienda_sin_responder, reembolso_fallido, ticket_esperando] }
              pedidoId: { type: string, format: uuid }
              ticketId: { type: string, format: uuid }
              folio: { type: string, example: R-000053 }
              desde: { type: string, format: date-time }

    TiendaPanel:
      type: object
      required: [id, nombre, categoria, direccion, plan, abierta, abiertaAhora, dueno, pedidos30d, ventas30d, resenas, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        categoria: { type: string }
        imagenUrl: { type: string, nullable: true }
        direccion: { type: string }
        telefono: { type: string, nullable: true }
        plan: { type: string, enum: [basico, pro, premium], description: Plan vigente }
        planHasta: { type: string, format: date-time, nullable: true }
        calificacion: { type: number, nullable: true }
        abierta: { type: boolean, description: Interruptor de la tienda }
        abiertaAhora: { type: boolean, description: 'Recibe pedidos en este momento (interruptor, horario y pausa)' }
        pausadaHasta: { type: string, format: date-time, nullable: true }
        comisionPct: { type: number, nullable: true, description: Comisión propia; null usa la general }
        eliminadaEn: { type: string, format: date-time, nullable: true }
        eliminadaMotivo: { type: string, nullable: true }
        dueno:
          type: object
          required: [id, nombre, email, estado]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            email: { type: string }
            telefono: { type: string, nullable: true }
            estado: { $ref: '#/components/schemas/EstadoCuenta' }
        pedidos30d: { type: integer }
        ventas30d: { type: number, description: Productos vendidos en 30 días }
        resenas: { type: integer }
        creadoEn: { type: string, format: date-time }

    FichaTienda:
      allOf:
        - $ref: '#/components/schemas/Tienda'
        - type: object
          required: [dueno, comision, ultimos30Dias, sucursales, menu, pedidos, resenas, suscripciones]
          properties:
            pausadaHasta: { type: string, format: date-time, nullable: true }
            eliminadaEn: { type: string, format: date-time, nullable: true, description: Fecha de baja; null = activa }
            eliminadaMotivo: { type: string, nullable: true }
            tiempoPreparacionMin: { type: integer }
            dueno: { $ref: '#/components/schemas/Usuario' }
            comision:
              type: object
              required: [general, aplicada]
              properties:
                propia: { type: number, nullable: true }
                general: { type: number }
                aplicada: { type: number }
            ultimos30Dias:
              type: object
              properties:
                entregados: { type: integer }
                rechazados: { type: integer }
                cancelados: { type: integer }
                ventas: { type: number }
                preparacionMin: { type: integer, nullable: true }
            sucursales:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  direccion: { type: string }
            menu: { type: array, items: { $ref: '#/components/schemas/MenuCategoria' } }
            pedidos:
              type: array
              items:
                type: object
                required: [id, folio, estado, total, creadoEn]
                properties:
                  id: { type: string, format: uuid }
                  folio: { type: string }
                  estado: { $ref: '#/components/schemas/EstadoPedido' }
                  total: { type: number }
                  metodoPago: { type: string, enum: [efectivo, tarjeta] }
                  cliente: { type: string }
                  creadoEn: { type: string, format: date-time }
            resenas: { type: array, items: { $ref: '#/components/schemas/ResenaPanel' } }
            suscripciones:
              type: array
              items:
                type: object
                properties:
                  plan: { type: string }
                  monto: { type: number }
                  inicio: { type: string, format: date-time }
                  fin: { type: string, format: date-time }
                  creadoEn: { type: string, format: date-time }

    RepartidorPanel:
      type: object
      required: [id, nombre, email, estado, conectado, disponible, pedidosEnCurso, entregasHoy, entregasTotales, saldo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string }
        telefono: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoCuenta' }
        fotoUrl: { type: string, nullable: true }
        calificacion: { type: number, nullable: true }
        conectado: { type: boolean }
        disponible: { type: boolean }
        ubicacionEn: { type: string, format: date-time, nullable: true }
        ubicacion:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Coordenadas' }]
        vehiculo:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Vehiculo' }]
        pedidosEnCurso: { type: integer }
        entregasHoy: { type: integer }
        entregasTotales: { type: integer }
        saldo: { type: number, description: 'Cartera: positivo a su favor, negativo lo que debe' }
        creadoEn: { type: string, format: date-time }

    MapaDespacho:
      type: object
      required: [repartidores, pedidos, tiendas]
      properties:
        repartidores:
          type: array
          items:
            type: object
            required: [id, nombre, ubicacion, conectado, pedidosEnCurso]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              ubicacion: { $ref: '#/components/schemas/Coordenadas' }
              ubicacionEn: { type: string, format: date-time, nullable: true }
              conectado: { type: boolean }
              pedidosEnCurso: { type: integer }
        pedidos:
          type: array
          items:
            type: object
            required: [id, folio, estado, destino, tienda]
            properties:
              id: { type: string, format: uuid }
              folio: { type: string }
              estado: { $ref: '#/components/schemas/EstadoPedido' }
              repartidorId: { type: string, format: uuid, nullable: true }
              cliente: { type: string }
              destino: { $ref: '#/components/schemas/Coordenadas' }
              tienda:
                type: object
                required: [id, nombre, ubicacion]
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  ubicacion: { $ref: '#/components/schemas/Coordenadas' }
              minutosEsperando: { type: integer, nullable: true, description: Minutos listo sin repartidor }
        tiendas:
          type: array
          items:
            type: object
            required: [id, nombre, ubicacion]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              ubicacion: { $ref: '#/components/schemas/Coordenadas' }

    ResenaPanel:
      type: object
      required: [pedidoId, folio, estrellas, estrellasRepartidor, oculta, creadoEn, tienda, cliente]
      properties:
        pedidoId: { type: string, format: uuid }
        folio: { type: string }
        estrellas: { type: integer, minimum: 1, maximum: 5 }
        estrellasRepartidor: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, nullable: true }
        respuesta: { type: string, nullable: true }
        respondidoEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }
        oculta: { type: boolean }
        ocultaMotivo: { type: string, nullable: true }
        ocultaEn: { type: string, format: date-time, nullable: true }
        ocultaPor: { type: string, nullable: true, description: Nombre de quien la ocultó }
        tienda:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        cliente:
          type: object
          properties:
            id: { type: string, format: uuid, nullable: true }
            nombre: { type: string, nullable: true }

    SeriesMetricas:
      type: object
      required: [porDia, porHora, topTiendas, topRepartidores, tiempos]
      properties:
        porDia:
          type: array
          items:
            type: object
            required: [dia, pedidos, entregados, cancelados, ventas]
            properties:
              dia: { type: string, format: date }
              pedidos: { type: integer }
              entregados: { type: integer }
              cancelados: { type: integer }
              ventas: { type: number }
        porHora:
          type: array
          items:
            type: object
            required: [hora, pedidos]
            properties:
              hora: { type: integer, minimum: 0, maximum: 23 }
              pedidos: { type: integer }
        topTiendas:
          type: array
          items:
            type: object
            required: [id, nombre, pedidos, ventas]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              pedidos: { type: integer }
              ventas: { type: number }
        topRepartidores:
          type: array
          items:
            type: object
            required: [id, nombre, entregas]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              entregas: { type: integer }
              calificacion: { type: number, nullable: true }
        tiempos:
          type: object
          properties:
            entregaMin: { type: integer, nullable: true, description: Promedio de creado a entregado }
            preparacionMin: { type: integer, nullable: true, description: Promedio de creado a listo }
            ticketPromedio: { type: number, nullable: true }
            tarjeta: { type: integer }
            efectivo: { type: integer }

    AccionInterna:
      type: object
      required: [id, accion, metodo, ruta, estadoHttp, creadoEn, actor]
      properties:
        id: { type: string, format: uuid }
        accion: { type: string, example: Baneó una cuenta }
        metodo: { type: string, example: POST }
        ruta: { type: string, example: /soporte/usuarios/6f1c…/banear }
        recursoId: { type: string, format: uuid, nullable: true }
        detalle: { type: object, nullable: true, additionalProperties: true, description: 'Cuerpo enviado, sin contraseñas ni tokens' }
        estadoHttp: { type: integer }
        creadoEn: { type: string, format: date-time }
        actor:
          type: object
          properties:
            id: { type: string, format: uuid, nullable: true }
            nombre: { type: string, nullable: true }
            rol: { type: string }

    RutaViaje:
      type: object
      required: [fuente, puntos, metros, segundos]
      properties:
        fuente:
          type: string
          enum: [calles, linea_recta]
          description: '`calles`: trazo real por calles. `linea_recta`: OSRM no respondió y se unen las paradas.'
        puntos:
          type: array
          description: Puntos de la polilínea, en orden.
          items: { $ref: '#/components/schemas/Coordenadas' }
        metros: { type: integer, nullable: true, example: 3420 }
        segundos: { type: integer, nullable: true, description: Tiempo estimado manejando, example: 540 }

    Viaje:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [activo, finalizado]
        maxPedidos: { type: integer, example: 4 }
        efectivoAPagarTiendas: { type: number, example: 340.0 }
        efectivoACobrar: { type: number, example: 432.0 }
        gananciaEnvio: { type: number, example: 92.0 }
        propinas: { type: number, example: 20.0 }
        paradas:
          type: array
          description: Orden sugerido de visita (tiendas y domicilios)
          items:
            type: object
            properties:
              pedidoId: { type: string, format: uuid }
              tipo:
                type: string
                enum: [tienda, domicilio]
              nombre: { type: string, example: Tacos Don Pepe }
              direccion: { type: string }
              ubicacion: { $ref: '#/components/schemas/Coordenadas' }
              completada: { type: boolean }
              etaMin:
                type: integer
                nullable: true
                description: Minutos aproximados para llegar a esta parada siguiendo el orden; null si ya se completó
        pedidos:
          type: array
          items: { $ref: '#/components/schemas/Pedido' }

    Vehiculo:
      type: object
      required: [tipo, color]
      properties:
        tipo:
          type: string
          enum: [moto, bicicleta, auto]
        marca: { type: string, nullable: true, example: Italika }
        modelo: { type: string, nullable: true, example: FT150 }
        color: { type: string, example: Rojo }
        placa: { type: string, nullable: true, example: GTO123A, description: Obligatoria salvo en bicicleta }

    Ganancias:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        resumen:
          type: object
          properties:
            pedidos: { type: integer }
            viajes: { type: integer }
            gananciaEnvio: { type: number, example: 412.0, description: Envíos (con recargos) }
            propinas: { type: number, example: 60.0 }
            comisionPlataforma: { type: number, example: 41.2, description: Comisión de PaPedir sobre los envíos }
            reembolsoCupones: { type: number, example: 30.0, description: Cupones de PaPedir que se le abonan }
            gananciaNeta: { type: number, example: 460.8, description: envío + propinas − comisión + reembolsos }
            efectivoCobrado: { type: number, example: 2380.0, description: Total cobrado a clientes }
            pagadoATiendas: { type: number, example: 1968.0, description: Productos pagados a las tiendas }
            kmRecorridos: { type: number, description: Distancia tienda → cliente de los pedidos (aproximada) }
            calificacion: { type: number, nullable: true }
            calificaciones: { type: integer }
        porDia:
          type: array
          items:
            type: object
            properties:
              fecha: { type: string, format: date }
              pedidos: { type: integer }
              viajes: { type: integer }
              gananciaEnvio: { type: number }
              propinas: { type: number }
              comisionPlataforma: { type: number }
              reembolsoCupones: { type: number }
              gananciaNeta: { type: number }
              efectivoCobrado: { type: number }
              pagadoATiendas: { type: number }
              kmRecorridos: { type: number }

    # ── Documentos ──
    TipoDocumento:
      type: string
      example: ine
      description: 'Tipo del catálogo de documentos (GET /catalogos). Base: ine, licencia, tarjeta_circulacion, comprobante_domicilio, constancia_fiscal.'

    Documento:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        nombre: { type: string, example: Licencia de manejo }
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado]
        motivo: { type: string, nullable: true, description: Por qué se rechazó }
        creadoEn: { type: string, format: date-time }
        revisadoEn: { type: string, format: date-time, nullable: true }

    MotivoCancelacionRequest:
      type: object
      description: Al menos uno de los dos. Si solo va `codigo`, el texto del catálogo queda como motivo.
      properties:
        codigo: { type: string, example: cambio_de_opinion }
        motivo: { type: string, maxLength: 500 }

    Motivo:
      type: object
      properties:
        codigo: { type: string, example: tarda_demasiado }
        texto: { type: string, example: Tarda demasiado }

    Recargo:
      type: object
      properties:
        concepto: { type: string, example: Lluvia }
        monto: { type: number, example: 15 }

    GrupoPedidosRequest:
      type: object
      required: [direccionId, pedidos]
      properties:
        direccionId: { type: string, format: uuid }
        programadoPara: { type: string, format: date-time }
        notas: { type: string }
        pedidos:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: object
            required: [tiendaId, items]
            properties:
              tiendaId: { type: string, format: uuid }
              items: { $ref: '#/components/schemas/CotizarPedidoRequest/properties/items' }
              cupon: { type: string }
              propina: { type: number, minimum: 0, maximum: 500 }

    MensajePedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        pedidoId: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        autorRol: { $ref: '#/components/schemas/Rol' }
        texto: { type: string }
        creadoEn: { type: string, format: date-time }

    Notificacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, example: Pedido R-000123 }
        cuerpo: { type: string, example: Tu pedido va en camino }
        datos: { type: object, additionalProperties: { type: string }, example: { pedidoId: 9b1c... } }
        leida: { type: boolean }
        creadoEn: { type: string, format: date-time }

    ZonaInput:
      type: object
      required: [nombre, puntos]
      properties:
        nombre: { type: string, example: Celaya centro }
        activa: { type: boolean, default: true }
        recargo: { type: number, minimum: 0, default: 0 }
        puntos:
          type: array
          minItems: 3
          description: Vértices del polígono en orden, sin repetir el primero al final
          items: { $ref: '#/components/schemas/Coordenadas' }

    Zona:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }
        - $ref: '#/components/schemas/ZonaInput'

    Comisiones:
      type: object
      required: [tiendaPct, envioPct]
      properties:
        tiendaPct: { type: number, minimum: 0, maximum: 50, example: 10, description: '% sobre lo que la tienda cobra por productos' }
        envioPct: { type: number, minimum: 0, maximum: 50, example: 10, description: '% sobre el envío' }

    Recargos:
      type: object
      required: [nocturno, lluvia, demanda]
      properties:
        nocturno:
          type: object
          properties:
            activo: { type: boolean }
            desde: { type: string, example: '22:00' }
            hasta: { type: string, example: '06:00' }
            monto: { type: number, example: 10 }
        lluvia:
          type: object
          description: Se activa a mano cuando llueve
          properties:
            activo: { type: boolean }
            monto: { type: number, example: 15 }
        demanda:
          type: object
          description: Aplica cuando hay al menos `pedidosEsperando` pedidos listos con más de 5 min sin repartidor
          properties:
            activo: { type: boolean }
            pedidosEsperando: { type: integer, example: 5 }
            monto: { type: number, example: 10 }

    Configuracion:
      type: object
      properties:
        comisiones: { $ref: '#/components/schemas/Comisiones' }
        recargos: { $ref: '#/components/schemas/Recargos' }
        cartera: { $ref: '#/components/schemas/CarteraConfig' }

    CarteraConfig:
      type: object
      required: [limiteDeudaTienda, limiteDeudaRepartidor, limiteDeudaCliente, cargoCancelacion]
      properties:
        limiteDeudaTienda: { type: number, example: 1500, description: Con más deuda no puede abrir ni aceptar pedidos }
        limiteDeudaRepartidor: { type: number, example: 500, description: Con más deuda no puede conectarse ni tomar pedidos }
        limiteDeudaCliente: { type: number, example: 150, description: Con más deuda solo puede pagar con tarjeta }
        cargoCancelacion: { type: number, example: 25, description: Al cliente que cancela en efectivo cuando la tienda ya aceptó; se le abona a la tienda }

    CuponInput:
      type: object
      required: [codigo, tipo]
      properties:
        codigo: { type: string, pattern: '^[A-Za-z0-9]{4,20}$', example: BIENVENIDA }
        descripcion: { type: string }
        tipo:
          type: string
          enum: [porcentaje, monto, envio_gratis]
        valor: { type: number, description: '% (porcentaje) o pesos (monto); no aplica a envío gratis' }
        maximoDescuento: { type: number, nullable: true }
        minimoCompra: { type: number, default: 0 }
        tiendaId: { type: string, format: uuid, nullable: true, description: 'Solo admin. Sin tienda, lo paga PaPedir' }
        inicio: { type: string, format: date-time, nullable: true }
        fin: { type: string, format: date-time, nullable: true }
        usosMaximos: { type: integer, nullable: true, description: En total; null = sin límite }
        usosPorCliente: { type: integer, default: 1 }
        soloPrimerPedido: { type: boolean, default: false }
        activo: { type: boolean, default: true }

    CuponUpdate:
      type: object
      properties:
        descripcion: { type: string }
        fin: { type: string, format: date-time, nullable: true }
        usosMaximos: { type: integer, nullable: true }
        activo: { type: boolean }

    Cupon:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            usos: { type: integer, description: Pedidos que lo usaron (sin contar cancelados) }
            creadoEn: { type: string, format: date-time }
        - $ref: '#/components/schemas/CuponInput'

    Movimiento:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [comision_tienda, comision_envio, descuento_plataforma, liquidacion, venta_tarjeta, envio_tarjeta, pago_con_saldo, reverso_saldo, saldo_cliente, pago_deuda, deuda_cobrada, reembolso, cargo_cancelacion, compensacion_cancelacion, ajuste]
          description: |
            venta_tarjeta / envio_tarjeta: pedido con tarjeta; PaPedir le paga a la tienda su venta y al repartidor su envío y propina.
            pago_con_saldo / pago_deuda: el cliente usó su saldo o pagó su adeudo en un pedido; reverso_saldo lo deshace si no se entregó.
            saldo_cliente / deuda_cobrada: en efectivo el repartidor cobró de menos (saldo del cliente) o de más (adeudo del cliente).
            reembolso: soporte devolvió dinero a la cartera. cargo_cancelacion / compensacion_cancelacion: cancelación tardía en efectivo.
        monto: { type: number, description: '> 0 a tu favor; < 0 lo que debes' }
        descripcion: { type: string, example: Comisión 10% del pedido R-000123 }
        pedidoId: { type: string, format: uuid, nullable: true }
        tiendaId: { type: string, format: uuid, nullable: true }
        liquidacionId: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time }

    EstadoDeCuenta:
      type: object
      properties:
        saldo: { type: number, example: -152.3, description: '> 0 a tu favor; < 0 lo que debes' }
        estado: { type: string, enum: [a_favor, debe, en_cero] }
        limiteDeuda: { type: number, nullable: true, description: Deuda máxima permitida para tu rol }
        bloqueado: { type: boolean, description: Pasaste el límite de deuda }
        movimientos:
          type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Movimiento' }
            meta: { $ref: '#/components/schemas/PaginaMeta' }

    LiquidacionInput:
      type: object
      required: [usuarioId, sentido, monto, metodo]
      properties:
        usuarioId: { type: string, format: uuid }
        sentido:
          type: string
          enum: [cobro, pago]
        monto: { type: number, minimum: 0.01 }
        metodo:
          type: string
          enum: [efectivo, transferencia]
        referencia: { type: string }
        nota: { type: string }

    Liquidacion:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            registradoPor: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }
            anuladaEn: { type: string, format: date-time, nullable: true }
            anuladaMotivo: { type: string, nullable: true }
        - $ref: '#/components/schemas/LiquidacionInput'

    Sugerencia:
      type: object
      properties:
        texto: { type: string, example: 'Instituto Tecnológico de Celaya, Av. Tecnológico' }
        detalle: { type: string, nullable: true, example: 'Celaya, Gto.' }
        ubicacion: { $ref: '#/components/schemas/Coordenadas' }
        tipo: { type: string, nullable: true, example: university }

    MotivoCatalogo:
      type: object
      required: [codigo, texto, activo]
      properties:
        codigo: { type: string, pattern: '^[a-z0-9_]{2,40}$' }
        texto: { type: string }
        activo: { type: boolean }

    Catalogos:
      type: object
      required: [motivos, categorias, documentos, legal]
      properties:
        motivos:
          type: object
          properties:
            cliente: { type: array, items: { $ref: '#/components/schemas/MotivoCatalogo' } }
            tienda: { type: array, items: { $ref: '#/components/schemas/MotivoCatalogo' } }
            soporte: { type: array, items: { $ref: '#/components/schemas/MotivoCatalogo' } }
            sistema: { type: array, items: { $ref: '#/components/schemas/MotivoCatalogo' } }
        categorias:
          type: array
          items:
            type: object
            required: [codigo, nombre, activa]
            properties:
              codigo: { type: string, pattern: '^[a-z0-9_]{2,40}$' }
              nombre: { type: string }
              activa: { type: boolean }
        documentos:
          type: object
          properties:
            repartidor: { type: array, items: { $ref: '#/components/schemas/DocumentoCatalogo' } }
            tienda: { type: array, items: { $ref: '#/components/schemas/DocumentoCatalogo' } }
            exigirParaAprobar: { type: boolean }
        legal:
          type: object
          properties:
            versionTerminos: { type: string, example: 2026-11 }

    DocumentoCatalogo:
      type: object
      required: [tipo, nombre, obligatorio]
      properties:
        tipo: { type: string, pattern: '^[a-z0-9_]{2,40}$' }
        nombre: { type: string }
        obligatorio: { type: boolean }

    CatalogosPublicos:
      type: object
      properties:
        categorias: { type: array, items: { type: object, properties: { codigo: { type: string }, nombre: { type: string } } } }
        motivos:
          type: object
          properties:
            cliente: { type: array, items: { $ref: '#/components/schemas/Motivo' } }
            tienda: { type: array, items: { $ref: '#/components/schemas/Motivo' } }
            soporte: { type: array, items: { $ref: '#/components/schemas/Motivo' } }
        documentos:
          type: object
          properties:
            repartidor: { type: array, items: { $ref: '#/components/schemas/DocumentoCatalogo' } }
            tienda: { type: array, items: { $ref: '#/components/schemas/DocumentoCatalogo' } }
        versionTerminos: { type: string }

    EnvioPush:
      type: object
      properties:
        id: { type: string, format: uuid }
        destino: { type: string, enum: [tema, rol] }
        tema: { type: string, nullable: true }
        rol: { type: string, nullable: true }
        titulo: { type: string }
        cuerpo: { type: string }
        destinatarios: { type: integer, nullable: true }
        modo: { type: string, example: enviada }
        creadoEn: { type: string, format: date-time }
        actor: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, nombre: { type: string, nullable: true } } }

    Plan:
      type: object
      properties:
        codigo: { type: string, enum: [basico, pro, premium] }
        nombre: { type: string, example: Pro }
        precioMensual: { type: number, example: 199 }
        comisionPct: { type: number, example: 7 }
        beneficios: { type: array, items: { type: string } }

    MiPlan:
      type: object
      properties:
        tiendaId: { type: string, format: uuid }
        plan: { type: string, enum: [basico, pro, premium] }
        planHasta: { type: string, format: date-time, nullable: true }
        comisionPct: { type: number, description: La que se aplica hoy (especial de admin → plan → general) }
        pagos:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              plan: { type: string }
              monto: { type: number }
              inicio: { type: string, format: date-time }
              fin: { type: string, format: date-time }
              creadoEn: { type: string, format: date-time }

    # ── Tickets ──
    EstadoTicket:
      type: string
      enum: [abierto, en_atencion, resuelto, cerrado]

    TicketInput:
      type: object
      required: [asunto, descripcion]
      properties:
        pedidoId: { type: string, format: uuid, nullable: true }
        asunto: { type: string, maxLength: 120, example: No recibí mi pedido }
        descripcion: { type: string, maxLength: 1000 }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: T-000045 }
        asunto: { type: string }
        descripcion: { type: string }
        estado: { $ref: '#/components/schemas/EstadoTicket' }
        prioridad: { type: string, enum: [baja, normal, alta, urgente] }
        pedidoId: { type: string, format: uuid, nullable: true }
        creadoPor:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            rol: { $ref: '#/components/schemas/Rol' }
        atendidoPor:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    Mensaje:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        autorRol: { $ref: '#/components/schemas/Rol' }
        texto: { type: string }
        creadoEn: { type: string, format: date-time }
