openapi: 3.0.3
info:
  title: PaPedir API
  version: 1.10.2
  description: |
    Contrato de la API de PaPedir, plataforma de reparto a domicilio en Celaya, Gto.

    - Consumidores: App Cliente, App Tienda, App Repartidor (Flutter) y Web Admin/Soporte (React).
    - Ningún cliente accede directo a la base de datos; todo pasa por esta API.
    - Autenticación: JWT en el header `Authorization: Bearer <accessToken>`.
    - JSON en camelCase, fechas ISO 8601 en UTC, montos en MXN con 2 decimales, IDs UUID.
    - Los eventos en tiempo real (Socket.IO) se documentan en ACUERDOS.md.
    - Las reglas de negocio completas están en el documento "PaPedir — Definición del proyecto".
    - Pago: solo efectivo en esta versión (`metodoPago = efectivo`).

    Este archivo es la fuente de verdad. Cualquier cambio se hace por Pull Request
    en `papedir-backend` y se avisa al equipo (ver ACUERDOS.md).
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: http://localhost:4010
    description: Mock con Prism
  - url: https://papedir-api.onrender.com/api/v1
    description: Producción (Render)

tags:
  - name: Salud
  - name: Auth
    description: Registro, login y sesión. Usado por las 3 apps y la web.
  - name: Usuarios
  - name: Direcciones
    description: App Cliente
  - name: Tiendas
    description: Consulta (App Cliente) y gestión de la propia tienda (App Tienda)
  - name: Productos
    description: App Tienda
  - name: Pedidos
    description: App Cliente y App Tienda
  - name: Repartidor
    description: App Repartidor
  - name: Tickets
    description: Incidencias y chat con soporte. Usado por las 3 apps y la web.
  - name: Soporte
    description: Web (rol soporte y admin)
  - name: Admin
    description: Web (rol admin)
  - name: Cliente
    description: Favoritos, búsqueda, notificaciones y catálogos
  - name: Pagos
    description: Pago con tarjeta (Stripe, modo prueba) y planes de suscripción de las tiendas
  - name: Finanzas
    description: Comisiones, saldos con PaPedir y liquidaciones
  - name: Configuración
    description: Zonas de cobertura, tarifas dinámicas, comisiones y cupones (admin)
  - name: Archivos
    description: Subida de imágenes (productos, tiendas, perfil, evidencia de entrega)
  - name: Documentos
    description: Documentos privados de repartidores y tiendas (INE, licencia...) y su revisión por soporte
  - name: Geo
    description: Sugerencias de direcciones y dirección de un punto
  - name: Catálogos
    description: Listas que edita admin (categorías, motivos, documentos, términos)
  - name: Panel
    description: Control total desde la web de soporte y admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: health
      tags: [Salud]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ─────────────────────────── AUTH ───────────────────────────
  /auth/register:
    post:
      operationId: registrar
      tags: [Auth]
      summary: Registrar cliente, tienda o repartidor
      description: |
        Los roles `soporte` y `admin` no se registran aquí; los crea un admin desde la web.
        Si `rol = tienda`, el campo `tienda` es obligatorio.
        Tiendas y repartidores nacen con `estado = pendiente_aprobacion` hasta que soporte los aprueba.
        `aceptoTerminos` debe ser `true` (la app muestra antes el aviso de privacidad y los términos, ver `GET /legal`).
        Al registrarse se envía al correo un código de 6 dígitos para verificarlo (`POST /auth/verificar-correo`).
        Verificar el correo no es obligatorio para usar la app.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuario creado y sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        `app` indica desde dónde se inicia sesión. El backend rechaza con 403 si el rol
        del usuario no corresponde a la app (ej. un repartidor en la App Cliente).
        - cliente → rol cliente
        - tienda → rol tienda
        - repartidor → rol repartidor
        - web → rol soporte o admin
        Responde 403 si la cuenta está baneada. Una cuenta `pendiente_aprobacion` sí puede iniciar sesión;
        la app debe mostrar un aviso de cuenta en revisión.
        Tras 5 contraseñas equivocadas seguidas la cuenta se bloquea 15 minutos: responde 403 `CUENTA_BLOQUEADA`
        (también con la contraseña correcta). Se desbloquea sola, restableciendo la contraseña o desde soporte.
        Si `usuario.terminosPendientes = true`, la app debe pedir aceptar los términos nuevos (`POST /usuarios/me/terminos`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/firebase:
    post:
      operationId: loginFirebase
      tags: [Auth]
      summary: Entrar a las apps con Firebase Authentication (Google, GitHub o correo)
      description: |
        La app inicia sesión con el SDK de Firebase y manda el ID token (`await user.getIdToken()`).
        La API lo valida y devuelve la sesión de PaPedir de siempre; el resto de la API no cambia.
        - Cuentas de correo y contraseña: el correo debe estar verificado (403 `CORREO_NO_VERIFICADO`).
          El envío del correo de verificación, su reenvío y la recuperación de contraseña los hace el SDK de Firebase.
        - Primera vez: responde 404 `REGISTRO_REQUERIDO`; la app pide teléfono y aceptar términos
          (y los datos de la tienda en la app de tiendas) y vuelve a llamar con `registro`.
        - Si ya existe una cuenta de PaPedir con ese correo y Firebase lo da por verificado, se ligan.
        - La foto de Google o GitHub se guarda en `fotoUrl` y se actualiza en cada inicio de sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginFirebaseRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Token de Firebase inválido o vencido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Correo sin verificar, cuenta baneada o app que no corresponde a la cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Primera vez; falta `registro` (`REGISTRO_REQUERIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El correo ya tiene una cuenta que no se puede ligar (`EMAIL_REGISTRADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      operationId: refrescarToken
      tags: [Auth]
      summary: Renovar el access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Cerrar sesión (invalida el refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Sesión cerrada }

  /auth/logout-todos:
    post:
      operationId: logoutTodos
      tags: [Auth]
      summary: Cerrar sesión en todos los dispositivos
      description: Invalida todos los refresh tokens del usuario. Los access tokens vigentes caducan solos en 15 min.
      responses:
        '204': { description: Sesiones cerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/recuperar:
    post:
      operationId: solicitarRecuperacion
      tags: [Auth]
      summary: Pedir un código para restablecer la contraseña
      description: |
        Envía al correo un código de 6 dígitos que vence en 15 minutos. Siempre responde 204, exista o no
        el correo, para no revelar qué correos están registrados. Máximo 3 códigos por hora por cuenta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: 'Si el correo existe, se envió el código' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/restablecer:
    post:
      operationId: restablecerPassword
      tags: [Auth]
      summary: Crear una contraseña nueva con el código del correo
      description: |
        Cambia la contraseña, desbloquea la cuenta, marca el correo como verificado y cierra todas las sesiones.
        Después la app inicia sesión con la contraseña nueva. Cada código sirve una vez y deja de servir
        tras 5 intentos equivocados (`CODIGO_INVALIDO`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, password]
              properties:
                email: { type: string, format: email }
                codigo: { type: string, pattern: '^[0-9]{6}$', example: '482913' }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Contraseña cambiada }
        '400':
          description: Datos inválidos (`VALIDACION`) o código incorrecto, vencido o ya usado (`CODIGO_INVALIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verificar-correo:
    post:
      operationId: verificarCorreo
      tags: [Auth]
      summary: Verificar el correo con el código recibido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodigoRequest' }
      responses:
        '200':
          description: Correo verificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400':
          description: Código incorrecto o vencido (`CODIGO_INVALIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verificar-correo/reenviar:
    post:
      operationId: reenviarVerificacion
      tags: [Auth]
      summary: Enviar otro código de verificación de correo
      responses:
        '204': { description: Código enviado }
        '409':
          description: El correo ya está verificado (`CORREO_YA_VERIFICADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Ya se enviaron 3 códigos en la última hora (`DEMASIADAS_PETICIONES`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      operationId: obtenerUsuarioActual
      tags: [Auth]
      summary: Usuario autenticado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── USUARIOS ───────────────────────────
  /legal:
    get:
      operationId: obtenerLegal
      tags: [Usuarios]
      summary: Versión vigente de los términos y ligas al aviso de privacidad
      description: La app muestra estas ligas en el registro y en su menú de ajustes.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Legal' }

  /usuarios/me:
    patch:
      operationId: actualizarMiPerfil
      tags: [Usuarios]
      summary: Actualizar mi perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: Ana López }
                telefono: { type: string, example: '4611234567' }
                fotoUrl:
                  type: string
                  nullable: true
                  description: URL devuelta por `POST /uploads` con `tipo = perfil`; `null` quita la foto
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: eliminarMiCuenta
      tags: [Usuarios]
      summary: Eliminar mi cuenta
      description: |
        Requiere la contraseña. Borra los datos personales (nombre, correo, teléfono, foto, direcciones,
        dispositivos) y cierra todas las sesiones; la tienda, si la hay, queda cerrada. Los pedidos se
        conservan para contabilidad, sin datos personales. El correo queda libre para registrarse de nuevo.
        No se puede si hay pedidos en curso (`TIENE_PEDIDOS_ACTIVOS`) ni si es la única cuenta de admin (`ULTIMO_ADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmarPasswordRequest' }
      responses:
        '204': { description: Cuenta eliminada }
        '403':
          description: Contraseña incorrecta (`PASSWORD_INCORRECTA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Tiene pedidos en curso o es el último admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /usuarios/me/password:
    put:
      operationId: cambiarPassword
      tags: [Usuarios]
      summary: Cambiar mi contraseña
      description: Cierra las demás sesiones y devuelve tokens nuevos para este dispositivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nueva]
              properties:
                actual: { type: string }
                nueva: { type: string, minLength: 8, description: Debe ser distinta de la actual }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: La contraseña actual es incorrecta (`PASSWORD_INCORRECTA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /usuarios/me/terminos:
    post:
      operationId: aceptarTerminos
      tags: [Usuarios]
      summary: Aceptar la versión vigente de los términos
      description: Se usa cuando `terminosPendientes = true`. `version` debe ser la de `GET /legal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: '2026-11' }
      responses:
        '200':
          description: Aceptados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409':
          description: La versión no es la vigente (`VERSION_TERMINOS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /usuarios/me/dispositivo:
    put:
      operationId: registrarDispositivo
      tags: [Usuarios]
      summary: Registrar el token de Firebase Cloud Messaging del dispositivo
      description: Llamar después de cada login y cuando FCM renueve el token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken, app]
              properties:
                fcmToken: { type: string }
                app: { $ref: '#/components/schemas/App' }
      responses:
        '204': { description: Registrado }

  # ─────────────────────────── DIRECCIONES ───────────────────────────
  /direcciones:
    get:
      operationId: listarDirecciones
      tags: [Direcciones]
      summary: Mis direcciones (rol cliente)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Direccion' }
    post:
      operationId: crearDireccion
      tags: [Direcciones]
      summary: Agregar dirección (rol cliente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /direcciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: actualizarDireccionesPorId
      tags: [Direcciones]
      summary: Editar dirección (rol cliente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: eliminarDireccionesPorId
      tags: [Direcciones]
      summary: Eliminar dirección (rol cliente)
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── TIENDAS ───────────────────────────
  /tiendas:
    get:
      operationId: listarTiendas
      tags: [Tiendas]
      summary: Buscar tiendas abiertas (rol cliente)
      description: Si se envían `lat` y `lng`, ordena por distancia y filtra por `radioKm`.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - name: radioKm
          in: query
          schema: { type: number, default: 5 }
        - name: q
          in: query
          description: Texto a buscar en nombre de la tienda
          schema: { type: string }
        - name: categoria
          in: query
          schema: { $ref: '#/components/schemas/CategoriaTienda' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tienda' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /tiendas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerTiendasPorId
      tags: [Tiendas]
      summary: Detalle de una tienda, con su horario semanal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tienda'
                  - type: object
                    properties:
                      horario:
                        type: array
                        items: { $ref: '#/components/schemas/Turno' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tiendas/{id}/resenas:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: resenasTienda
      tags: [Tiendas]
      summary: Reseñas de una tienda, de la más nueva a la más vieja
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pedidoId: { type: string, format: uuid }
                        calificacion: { type: integer, minimum: 1, maximum: 5 }
                        comentario: { type: string, nullable: true }
                        oculta: { type: boolean, description: 'Oculta por moderación: comentario y respuesta llegan en null' }
                        cliente: { type: string, example: Ana L., description: Nombre e inicial del apellido }
                        respuesta: { type: string, nullable: true, description: Respuesta de la tienda }
                        respondidoEn: { type: string, format: date-time, nullable: true }
                        creadoEn: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
                  resumen:
                    type: object
                    properties:
                      promedio: { type: number, nullable: true }
                      total: { type: integer }
                      porEstrellas:
                        type: object
                        additionalProperties: { type: integer }
                        example: { '5': 12, '4': 3, '3': 1, '2': 0, '1': 0 }

  /tiendas/{id}/menu:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerMenuTienda
      tags: [Tiendas]
      summary: Menú de una tienda agrupado por categorías (rol cliente)
      description: |
        Solo categorías con productos. Los agotados vienen con `agotado = true` (sin existencia o stock en 0):
        se muestran pero no se pueden pedir. Cada producto trae sus `grupos` de opciones.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuCategoria' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tiendas/solicitudes:
    get:
      operationId: misSolicitudesTienda
      tags: [Tiendas]
      summary: Mis solicitudes de tienda nueva (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudTienda' }
    post:
      operationId: solicitarTienda
      tags: [Tiendas]
      summary: Pedir otra tienda o sucursal (rol tienda)
      description: |
        Queda en revisión hasta que soporte o admin la aprueben; al aprobarla se crea la tienda cerrada.
        Solo con la cuenta aprobada (`CUENTA_PENDIENTE`). Con `copiarMenuDe` se copiará el menú de otra sucursal propia.
        Máximo 10 tiendas contando las solicitudes en revisión (`LIMITE_SUCURSALES`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SucursalInput' }
      responses:
        '202':
          description: En revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudTienda' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: CUENTA_PENDIENTE o LIMITE_SUCURSALES
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tiendas/solicitudes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: cancelarSolicitudTienda
      tags: [Tiendas]
      summary: Cancelar mi solicitud en revisión
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudTienda' }
        '404': { $ref: '#/components/responses/NotFound' }

  /soporte/solicitudes-tienda:
    get:
      operationId: listarSolicitudesTienda
      tags: [Soporte]
      summary: Solicitudes de tienda nueva (soporte y admin)
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, aprobada, rechazada, cancelada] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SolicitudTienda' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /soporte/solicitudes-tienda/{id}/aprobar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aprobarSolicitudTienda
      tags: [Soporte]
      summary: Aprobar y crear la tienda
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudTienda' }
        '409':
          description: Ya revisada o el dueño no está activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/solicitudes-tienda/{id}/rechazar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rechazarSolicitudTienda
      tags: [Soporte]
      summary: Rechazar con motivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudTienda' }

  /tiendas/mias:
    get:
      operationId: listarMisSucursales
      tags: [Tiendas]
      summary: Mis sucursales (rol tienda)
      description: |
        Un dueño puede tener varias sucursales. Las rutas `/tiendas/mia...`, `GET /pedidos` y los pedidos manuales
        trabajan con la sucursal indicada en el header `X-Tienda-Id`; sin header, con la primera (la más antigua).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tienda' }
    post:
      operationId: crearSucursal
      deprecated: true
      tags: [Tiendas]
      summary: Alias de POST /tiendas/solicitudes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SucursalInput' }
      responses:
        '202':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudTienda' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Cuenta sin aprobar o límite de sucursales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tiendas/mia:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: obtenerMiTienda
      tags: [Tiendas]
      summary: Mi tienda (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
    patch:
      operationId: actualizarMiTienda
      tags: [Tiendas]
      summary: Actualizar mi tienda, incluye abrir/cerrar (rol tienda)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TiendaUpdate' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /tiendas/mia/plan:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: miPlan
      tags: [Pagos]
      summary: Plan vigente de mi sucursal, su comisión y los pagos hechos (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiPlan' }
    post:
      operationId: elegirPlan
      tags: [Pagos]
      summary: Elegir plan (rol tienda)
      description: |
        `basico` cambia de inmediato. `pro` o `premium` devuelven `clientSecret` para pagar con flutter_stripe;
        después hay que llamar a `/tiendas/mia/plan/confirmar`. Cada pago da 30 días; renovar el mismo plan suma los días.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [basico, pro, premium] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string }
                  requierePago: { type: boolean }
                  monto: { type: number }
                  paymentIntentId: { type: string }
                  clientSecret: { type: string }
                  publishableKey: { type: string, nullable: true }
        '409':
          description: Cuenta en revisión (`CUENTA_PENDIENTE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tiendas/mia/plan/confirmar:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    post:
      operationId: confirmarPlan
      tags: [Pagos]
      summary: Activar el plan después de pagarlo (rol tienda)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentIntentId]
              properties:
                paymentIntentId: { type: string }
      responses:
        '200':
          description: Plan activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiPlan' }
        '402':
          description: El pago no se ha completado (`PAGO_PENDIENTE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Pago ya usado o con otro monto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tiendas/mia/horario:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: obtenerMiHorario
      tags: [Tiendas]
      summary: Horario semanal de mi tienda (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
    put:
      operationId: guardarMiHorario
      tags: [Tiendas]
      summary: Reemplazar el horario semanal (rol tienda)
      description: |
        Con `usarHorario = true` la tienda solo recibe pedidos dentro de sus turnos (además de estar `abierta`).
        Horas en hora de Celaya. `dia`: 0 = domingo … 6 = sábado. Puede haber varios turnos por día.
        `cierra = "24:00"` = hasta la medianoche; si `cierra` es menor que `abre`, el turno termina al día siguiente
        y cuenta para el día en que abre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usarHorario, turnos]
              properties:
                usarHorario: { type: boolean }
                turnos:
                  type: array
                  maxItems: 28
                  items: { $ref: '#/components/schemas/Turno' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /tiendas/mia/pausa:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    post:
      operationId: pausarMiTienda
      tags: [Tiendas]
      summary: Dejar de recibir pedidos por un rato (rol tienda)
      description: Útil cuando la cocina está saturada. Se quita sola al cumplirse el tiempo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutos]
              properties:
                minutos: { type: integer, minimum: 5, maximum: 240, example: 30 }
      responses:
        '200':
          description: Pausada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: quitarPausaMiTienda
      tags: [Tiendas]
      summary: Volver a recibir pedidos (rol tienda)
      responses:
        '200':
          description: Sin pausa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }

  /tiendas/mia/reporte:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: reporteVentas
      tags: [Tiendas]
      summary: Reporte de ventas de mi tienda (rol tienda)
      description: |
        Por fecha de creación del pedido, en hora de Celaya. `ventas` = productos de los pedidos entregados
        (lo que la tienda cobra al repartidor; el envío no cuenta). Rango máximo de 92 días.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteVentas' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /tiendas/mia/cupones:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: misCupones
      tags: [Tiendas]
      summary: Cupones de mi sucursal (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: '#/components/schemas/Cupon' }
    post:
      operationId: crearMiCupon
      tags: [Tiendas]
      summary: Crear un cupón de mi sucursal (rol tienda)
      description: El descuento lo absorbe la tienda (el repartidor le paga menos). La tienda no puede dar envío gratis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuponInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Código repetido (`CUPON_DUPLICADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tiendas/mia/cupones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/TiendaSel'
    patch:
      operationId: actualizarMiCupon
      tags: [Tiendas]
      summary: Activar/desactivar o cambiar vigencia de un cupón (rol tienda)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuponUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tiendas/mia/productos:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: listarMisProductos
      tags: [Productos]
      summary: Todos mis productos, incluidos los no disponibles (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Producto' }

  /tiendas/mia/categorias:
    parameters:
      - $ref: '#/components/parameters/TiendaSel'
    get:
      operationId: listarMisCategorias
      tags: [Productos]
      summary: Categorías de productos de mi tienda (rol tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoriaProducto' }
    post:
      operationId: crearCategoria
      tags: [Productos]
      summary: Crear categoría de productos (rol tienda)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaProductoInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaProducto' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: actualizarCategoria
      tags: [Productos]
      summary: Renombrar o reordenar categoría (rol tienda)
      description: Acepta solo los campos que cambian.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaProductoInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaProducto' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: eliminarCategoria
      tags: [Productos]
      summary: Eliminar categoría vacía (rol tienda)
      responses:
        '204': { description: Eliminada }
        '409':
          description: La categoría todavía tiene productos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────── PRODUCTOS ───────────────────────────
  /productos:
    post:
      operationId: crearProducto
      tags: [Productos]
      summary: Crear producto en mi tienda (rol tienda)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /productos/{id}/opciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: guardarOpcionesProducto
      tags: [Productos]
      summary: Reemplazar las opciones de un producto (tamaño, salsas, extras...)
      description: |
        Reemplaza todos los grupos. `minimo = 0` = opcional; `minimo ≥ 1` = obligatorio.
        `maximo` no puede ser mayor que el número de opciones. Las opciones reciben ids nuevos en cada cambio;
        los pedidos anteriores guardan su propia copia. `[]` quita todas las opciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grupos]
              properties:
                grupos:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/GrupoOpcionesInput' }
      responses:
        '200':
          description: Guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /productos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: actualizarProductosPorId
      tags: [Productos]
      summary: Editar producto (rol tienda, dueña del producto)
      description: Acepta solo los campos que cambian; por ejemplo, enviar solo `disponible` en false para marcarlo agotado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: eliminarProductosPorId
      tags: [Productos]
      summary: Eliminar producto (rol tienda, dueña del producto)
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── PEDIDOS ───────────────────────────
  /pedidos:
    get:
      operationId: listarPedidos
      tags: [Pedidos]
      summary: Listar pedidos según el rol
      description: |
        - cliente: sus pedidos
        - tienda: con `X-Tienda-Id`, los de esa sucursal; sin header, los de todas sus sucursales
        - repartidor: usar /repartidor/historial
      parameters:
        - $ref: '#/components/parameters/TiendaSel'
        - name: estado
          in: query
          description: Uno o varios estados separados por coma
          schema: { type: string, example: 'creado,aceptado_tienda' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
    post:
      operationId: crearPedido
      tags: [Pedidos]
      summary: Crear pedido desde la App Cliente (rol cliente)
      description: |
        El backend recalcula precios, subtotal, costo de envío y total; el cliente no los envía.
        Reglas: una sola tienda, mínimo $50 de productos, máximo $1,500 de total en efectivo, destino a 8 km o menos.
        Genera `codigoEntrega` (4 dígitos), visible solo para el cliente. La tienda tiene 5 min para aceptar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearPedidoRequest' }
      responses:
        '201':
          description: Pedido creado en estado `creado`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Tienda cerrada, producto agotado, fuera de cobertura, pedido menor al mínimo o mayor al máximo en efectivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/grupo:
    post:
      operationId: crearGrupoPedidos
      tags: [Pedidos]
      summary: Carrito con productos de 2 o 3 tiendas (rol cliente)
      description: |
        Crea un pedido por tienda, cada uno con su envío, su repartidor y su código de entrega, unidos por `grupoId`.
        Se validan todos antes de crear: si uno falla, no se crea ninguno. Cupón y propina van por tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoPedidosRequest' }
      responses:
        '201':
          description: Creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  grupoId: { type: string, format: uuid }
                  total: { type: number, description: Suma de los totales }
                  pedidos:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Alguna tienda cerrada, producto agotado, cupón inválido...
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/cotizar:
    post:
      operationId: cotizarPedido
      tags: [Pedidos]
      summary: Cotizar un pedido antes de confirmarlo (rol cliente)
      description: Calcula subtotal, costo de envío por distancia y total. No crea nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizarPedidoRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Fuera de cobertura, tienda cerrada o producto agotado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/cotizar-manual:
    post:
      operationId: cotizarPedidoManual
      tags: [Pedidos]
      summary: Cotizar el envío de un pedido manual (rol tienda)
      parameters:
        - $ref: '#/components/parameters/TiendaSel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ubicacion, montoACobrar]
              properties:
                ubicacion: { $ref: '#/components/schemas/Coordenadas' }
                montoACobrar: { type: number, minimum: 0, example: 350.0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '409':
          description: Destino fuera de cobertura (más de 8 km)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/manual:
    post:
      operationId: crearPedidoManual
      tags: [Pedidos]
      summary: Crear pedido manual capturando los datos del cliente (rol tienda)
      parameters:
        - $ref: '#/components/parameters/TiendaSel'
      description: |
        Para vendedores independientes o tiendas con ventas externas. No requiere cliente registrado.
        Nace en estado `listo_para_recoger`. El destinatario paga en efectivo `montoACobrar` + costo de envío.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoManualRequest' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerPedidosPorId
      tags: [Pedidos]
      summary: Detalle de un pedido (cliente, tienda o repartidor involucrados; soporte)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pedidos/{id}/eventos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarEventosPedido
      tags: [Pedidos]
      summary: Bitácora de eventos del pedido (para la línea de tiempo)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoPedido' }

  /pedidos/{id}/aceptar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aceptarPedido
      tags: [Pedidos]
      summary: Tienda acepta el pedido (creado → aceptado_tienda)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /pedidos/{id}/rechazar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rechazarPedido
      tags: [Pedidos]
      summary: Tienda rechaza el pedido (creado → rechazado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoCancelacionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /pedidos/{id}/listo:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: marcarPedidoListo
      tags: [Pedidos]
      summary: Tienda marca el pedido listo (aceptado_tienda → listo_para_recoger)
      description: A partir de aquí aparece en el mapa de los repartidores cercanos.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /pedidos/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: cancelarPedido
      tags: [Pedidos]
      summary: Cancelar pedido
      description: |
        - cliente: en `programado` o `creado`
        - tienda: antes de `asignado`
        Manda un `codigo` de GET /catalogos/motivos-cancelacion, un `motivo` libre, o ambos.
        Después de eso solo soporte puede cancelar (/soporte/pedidos/{id}/cancelar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoCancelacionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /pedidos/{id}/repetir:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: repetirPedido
      tags: [Pedidos]
      summary: Armar el carrito de un pedido anterior (rol cliente)
      description: |
        Usa el menú de hoy: precios actuales y las mismas opciones (por nombre). Lo que ya no se puede pedir va en
        `omitidos`. No crea el pedido: la app muestra el carrito y luego cotiza y crea normalmente.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  tienda:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nombre: { type: string }
                      abiertaAhora: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productoId: { type: string, format: uuid }
                        nombre: { type: string }
                        cantidad: { type: integer }
                        opciones: { type: array, items: { type: string, format: uuid } }
                        precioUnitario: { type: number }
                  omitidos:
                    type: array
                    items:
                      type: object
                      properties:
                        nombre: { type: string }
                        motivo: { type: string, example: Agotado }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pedidos/{id}/calificacion/respuesta:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: responderResena
      tags: [Pedidos]
      summary: La tienda responde públicamente la reseña de un pedido (rol tienda)
      description: Se puede editar mandándola otra vez. El cliente recibe una notificación.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  pedidoId: { type: string, format: uuid }
                  respuesta: { type: string }
                  respondidoEn: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

  /pedidos/{id}/mensajes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: mensajesPedido
      tags: [Pedidos]
      summary: Chat del pedido entre cliente y repartidor (últimos 200, del más viejo al más nuevo)
      description: Lo ven el cliente, el repartidor asignado y soporte. Evento en tiempo real `pedido:mensaje`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: '#/components/schemas/MensajePedido' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: enviarMensajePedido
      tags: [Pedidos]
      summary: Escribir en el chat del pedido
      description: Solo mientras el repartidor lleva el pedido (asignado → en_domicilio); si no, 409 `CHAT_CERRADO`. Soporte puede escribir siempre.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajePedido' }
        '409':
          description: Chat cerrado o pedido manual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/{id}/calificar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: calificarPedido
      tags: [Pedidos]
      summary: Calificar tienda y repartidor (rol cliente, hasta 24 h después de entregado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalificacionInput' }
      responses:
        '201':
          description: Registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calificacion' }
        '409':
          description: El pedido no está entregado, ya fue calificado o pasaron más de 24 h
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────── REPARTIDOR ───────────────────────────
  /repartidor/vehiculo:
    get:
      operationId: obtenerMiVehiculo
      tags: [Repartidor]
      summary: Mi vehículo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '204': { description: Aún no registra su vehículo }
    put:
      operationId: guardarMiVehiculo
      tags: [Repartidor]
      summary: Registrar o cambiar mi vehículo
      description: El cliente lo ve en su pedido para reconocer al repartidor. La placa es obligatoria salvo en bicicleta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehiculo' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /repartidor/ganancias:
    get:
      operationId: misGanancias
      tags: [Repartidor]
      summary: Ganancias y corte de efectivo por día
      description: |
        Pedidos entregados por día (hora de Celaya). En cada pedido el repartidor paga los productos a la tienda,
        cobra el total al cliente y se queda con el envío. Con `desde = hasta = hoy` es el corte de caja del día.
        Por defecto, los últimos 7 días. Rango máximo de 92 días.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ganancias' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /repartidor/disponibilidad:
    patch:
      operationId: actualizarRepartidorDisponibilidad
      tags: [Repartidor]
      summary: Conectarse / desconectarse para recibir pedidos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disponible]
              properties:
                disponible: { type: boolean }
      description: No se puede desconectar con un viaje activo, ni conectar con la cuenta pendiente de aprobación.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponible: { type: boolean }
        '409':
          description: Viaje activo o cuenta pendiente de aprobación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /repartidor/ubicacion:
    put:
      operationId: guardarRepartidorUbicacion
      tags: [Repartidor]
      summary: Reportar ubicación actual (respaldo HTTP)
      description: |
        Lo normal es emitir `repartidor:ubicacion` por Socket.IO cada 10 s.
        Este endpoint es el respaldo si el socket está desconectado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Coordenadas' }
      responses:
        '204': { description: Registrada }

  /repartidor/pedidos-disponibles:
    get:
      operationId: listarRepartidorPedidosDisponibles
      tags: [Repartidor]
      summary: Pedidos `listo_para_recoger` cercanos para el mapa
      description: |
        Radio inicial 3 km (6 km para pedidos con más de 5 min sin repartidor).
        Con un viaje activo solo devuelve pedidos encadenables: tienda a 1.5 km o menos de una parada
        pendiente y destino a 3 km o menos de otro destino del viaje. Nada si ya lleva 4 pedidos.
      parameters:
        - $ref: '#/components/parameters/LatRequerida'
        - $ref: '#/components/parameters/LngRequerida'
        - name: radioKm
          in: query
          schema: { type: number, default: 3 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PedidoDisponible' }

  /repartidor/pedidos/{id}/tomar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: tomarPedido
      tags: [Repartidor]
      summary: Tomar un pedido (listo_para_recoger → asignado)
      description: |
        Operación atómica. Si otro repartidor lo tomó primero responde 409 y la app debe
        quitarlo del mapa. El pedido se agrega al viaje activo o crea uno nuevo.
        Máximo 4 pedidos por viaje; un pedido no encadenable también responde 409.
        El repartidor debe estar conectado (409 `REPARTIDOR_DESCONECTADO`).
      responses:
        '200':
          description: Pedido asignado; devuelve el viaje actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Viaje' }
        '409':
          description: El pedido ya fue tomado, el viaje ya tiene 4 pedidos o el pedido no es encadenable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /repartidor/viaje-actual:
    get:
      operationId: obtenerRepartidorViajeActual
      tags: [Repartidor]
      summary: Viaje activo con sus pedidos en orden de visita
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Viaje' }
        '204': { description: Sin viaje activo }

  /repartidor/viaje-actual/ruta:
    get:
      operationId: obtenerRutaDelViaje
      tags: [Repartidor]
      summary: Trazo por calles del viaje activo para dibujarlo en el mapa
      description: >-
        Desde la última ubicación reportada (`PUT /repartidor/ubicacion`) por las paradas pendientes, en el orden
        de `paradas`. Se calcula con OSRM (OpenStreetMap). Si OSRM no responde, `fuente` es `linea_recta` y
        `puntos` son las paradas, para que la app siempre tenga qué dibujar. Basta pedirla al cargar el viaje y
        después de cada marca; la API la guarda 2 minutos.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RutaViaje' }
        '204': { description: Sin viaje activo }

  /repartidor/pedidos/{id}/llegada-tienda:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: marcarLlegadaTienda
      tags: [Repartidor]
      summary: Marcar llegada a la tienda (asignado → en_tienda)
      description: Solo se acepta a 150 m o menos del punto (geocerca); si no, 409 `FUERA_DE_RANGO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /repartidor/pedidos/{id}/salida-tienda:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: marcarSalidaTienda
      tags: [Repartidor]
      summary: Marcar salida de la tienda con el pedido (en_tienda → en_camino)
      description: Al salir, el repartidor ya pagó a la tienda el `montoAPagarTienda` del pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /repartidor/pedidos/{id}/llegada-cliente:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: marcarLlegadaCliente
      tags: [Repartidor]
      summary: Marcar llegada al domicilio (en_camino → en_domicilio)
      description: Solo se acepta a 150 m o menos del punto (geocerca); si no, 409 `FUERA_DE_RANGO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /repartidor/pedidos/{id}/entregado:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: marcarEntregado
      tags: [Repartidor]
      summary: Marcar entrega de productos (en_domicilio → entregado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntregaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /repartidor/historial:
    get:
      operationId: listarRepartidorHistorial
      tags: [Repartidor]
      summary: Pedidos entregados por mí
      description: |
        Pedidos ya terminados, del más reciente al más antiguo. En pedidos terminados `tienda.telefono` y
        `destino.telefono` vienen en `null` (privacidad). `resumen` es de toda la vida del repartidor:
        úsalo para el encabezado en vez de sumar la página cargada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, resumen]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
                  resumen:
                    type: object
                    required: [entregas, propinas, gananciaNeta]
                    properties:
                      entregas: { type: integer, description: Pedidos entregados en total }
                      propinas: { type: number }
                      gananciaNeta: { type: number, description: 'Envío + propinas − comisión de PaPedir + cupones que PaPedir le reembolsa' }

  # ─────────────────────────── ARCHIVOS ───────────────────────────
  /documentos:
    get:
      operationId: misDocumentos
      tags: [Documentos]
      summary: Documentos que pide mi rol y el estado de cada uno (repartidor y tienda)
      responses:
        '200':
          description: Uno por tipo de documento de su rol
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tipo: { $ref: '#/components/schemas/TipoDocumento' }
                    nombre: { type: string, example: INE }
                    requerido: { type: boolean, description: Soporte lo necesita aprobado para aprobar la cuenta }
                    documento:
                      allOf: [{ $ref: '#/components/schemas/Documento' }]
                      nullable: true
                      type: object
    post:
      operationId: subirDocumento
      tags: [Documentos]
      summary: Subir o reemplazar un documento (repartidor y tienda)
      description: |
        JPG, PNG, WebP o PDF de hasta 5 MB. Se guarda en un bucket privado: nadie tiene una URL pública.
        Uno por tipo; al reemplazarlo vuelve a `pendiente`. Uno aprobado ya no se puede reemplazar (`DOCUMENTO_APROBADO`).
        Repartidor: ine, licencia, tarjeta_circulacion, comprobante_domicilio. Tienda: ine, comprobante_domicilio, constancia_fiscal.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipo]
              properties:
                archivo: { type: string, format: binary }
                tipo: { $ref: '#/components/schemas/TipoDocumento' }
      responses:
        '201':
          description: Subido, pendiente de revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Ya está aprobado (`DOCUMENTO_APROBADO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /favoritos:
    get:
      operationId: misFavoritos
      tags: [Cliente]
      summary: Mis tiendas favoritas (rol cliente)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: '#/components/schemas/Tienda' }

  /favoritos/{tiendaId}:
    parameters:
      - name: tiendaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: agregarFavorito
      tags: [Cliente]
      summary: Marcar tienda como favorita
      responses:
        '204': { description: Agregada }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: quitarFavorito
      tags: [Cliente]
      summary: Quitar de favoritas
      responses:
        '204': { description: Quitada }

  /productos/buscar:
    get:
      operationId: buscarProductos
      tags: [Cliente]
      summary: Buscar productos en las tiendas que reciben pedidos ahora
      description: Por nombre o descripción. Con lat/lng solo dentro del radio y de la tienda más cercana a la más lejana.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, example: pastor }
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - name: radioKm
          in: query
          schema: { type: number, default: 8 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        producto: { $ref: '#/components/schemas/Producto' }
                        tienda:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            nombre: { type: string }
                            imagenUrl: { type: string, nullable: true }
                            distanciaKm: { type: number, nullable: true }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

  /notificaciones:
    get:
      operationId: misNotificaciones
      tags: [Cliente]
      summary: Bandeja de notificaciones (todos los roles)
      description: |
        Todo lo que llega por push también se guarda aquí (60 días). En tiempo real llega el evento `notificacion:nueva`.
      parameters:
        - name: soloNoLeidas
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacion' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
                  noLeidas: { type: integer, description: Para el globito de la campana }

  /notificaciones/leer-todas:
    post:
      operationId: leerTodasNotificaciones
      tags: [Cliente]
      summary: Marcar todas como leídas
      responses:
        '204': { description: Listo }

  /notificaciones/{id}/leer:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: leerNotificacion
      tags: [Cliente]
      summary: Marcar una como leída
      responses:
        '204': { description: Listo }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalogos/motivos-cancelacion:
    get:
      operationId: motivosCancelacion
      tags: [Cliente]
      summary: Motivos para cancelar o rechazar, por rol
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  cliente: { type: array, items: { $ref: '#/components/schemas/Motivo' } }
                  tienda: { type: array, items: { $ref: '#/components/schemas/Motivo' } }
                  soporte: { type: array, items: { $ref: '#/components/schemas/Motivo' } }

  /zonas:
    get:
      operationId: zonasActivas
      tags: [Cliente]
      summary: Zonas de cobertura activas (para dibujarlas en el mapa)
      description: Sin zonas activas se atiende cualquier destino a 8 km o menos de la tienda.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: '#/components/schemas/Zona' }

  /cartera:
    get:
      operationId: miCartera
      tags: [Finanzas]
      summary: Mi cartera (cliente, tienda o repartidor)
      description: |
        Como en DiDi. Saldo > 0: dinero a tu favor. Saldo < 0: lo que debes a PaPedir.
        - Cliente: los reembolsos suman; cancelar en efectivo cuando la tienda ya aceptó resta. Se aplica sola en el siguiente pedido.
        - Tienda y repartidor: las comisiones de lo cobrado en efectivo restan; lo cobrado con tarjeta suma. Se salda con una liquidación.
        Con `bloqueado` = true la cuenta pasó su límite de deuda (`DEUDA_EXCEDIDA`).
        `/saldo` es un alias.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeCuenta' }
  /saldo:
    get:
      operationId: miSaldo
      deprecated: true
      tags: [Finanzas]
      summary: Alias de /cartera
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeCuenta' }

  /pagos/config:
    get:
      operationId: configuracionPagos
      tags: [Pagos]
      summary: Llave publicable de Stripe para inicializar flutter_stripe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishableKey: { type: string, nullable: true, example: pk_test_... }
                  moneda: { type: string, example: mxn }
                  maximoTarjeta: { type: number, example: 10000 }

  /pagos/intento:
    post:
      operationId: crearIntentoDePago
      tags: [Pagos]
      summary: Paso 1 del pago con tarjeta de un pedido (rol cliente)
      description: |
        Recibe el mismo cuerpo que POST /pedidos/cotizar. Crea un PaymentIntent de Stripe por el total que solo
        autoriza la tarjeta (no cobra todavía).
        1. La app muestra el formulario de tarjeta de flutter_stripe y confirma con `clientSecret`.
        2. Crea el pedido con `POST /pedidos` + `metodoPago: tarjeta` + `paymentIntentId`.
        3. El backend verifica que lo autorizado sea exactamente el total, cobra y crea el pedido.
        Si el pedido no se puede crear, no se cobra; si se cancela o rechaza después, se reembolsa solo.
        El backend nunca ve los datos de la tarjeta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizarPedidoRequest' }
      responses:
        '200':
          description: Intento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentIntentId: { type: string, example: pi_3QxYz... }
                  clientSecret: { type: string }
                  publishableKey: { type: string, nullable: true }
                  cotizacion: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Stripe no está configurado (`PAGOS_NO_CONFIGURADO`); ofrecer efectivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /planes:
    get:
      operationId: listarPlanes
      tags: [Pagos]
      summary: Planes de suscripción para tiendas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }

  /uploads:
    post:
      operationId: subirImagen
      tags: [Archivos]
      summary: Subir una imagen y obtener su URL
      description: |
        JPG, PNG o WebP de hasta 5 MB. El backend la guarda en Supabase Storage y devuelve la URL
        pública para usarla en `imagenUrl`, `evidenciaUrl` o `fotoUrl`. Las apps nunca hablan con Supabase.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipo]
              properties:
                archivo: { type: string, format: binary }
                tipo:
                  type: string
                  enum: [producto, tienda, evidencia, perfil]
      responses:
        '201':
          description: Subida
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: 'https://xyz.supabase.co/storage/v1/object/public/productos/abc.webp' }
        '400':
          description: Formato no permitido o archivo mayor a 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────── TICKETS (las 3 apps + web) ───────────────────────────
  /tickets:
    get:
      operationId: listarTickets
      tags: [Tickets]
      summary: Mis tickets (cliente/tienda/repartidor); soporte ve todos
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoTicket' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }
    post:
      operationId: crearTicket
      tags: [Tickets]
      summary: Abrir ticket con soporte (cliente, tienda o repartidor)
      description: Solo un ticket abierto por pedido y usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Ya existe un ticket abierto para ese pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obtenerTicketsPorId
      tags: [Tickets]
      summary: Detalle de ticket
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/mensajes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarMensajesTicket
      tags: [Tickets]
      summary: Historial del chat del ticket
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mensaje' }
    post:
      operationId: enviarMensajeTicket
      tags: [Tickets]
      summary: Enviar mensaje en el ticket
      description: El mensaje también se emite en tiempo real como `ticket:mensaje`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, maxLength: 1000, example: Mi pedido no ha llegado }
      responses:
        '201':
          description: Enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensaje' }
        '409':
          description: El ticket está cerrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────── SOPORTE (web) ───────────────────────────
  /soporte/pedidos:
    get:
      operationId: listarSoportePedidos
      tags: [Soporte]
      summary: Buscar cualquier pedido (rol soporte/admin)
      parameters:
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
        - { name: repartidorId, in: query, schema: { type: string, format: uuid } }
        - { name: tiendaId, in: query, schema: { type: string, format: uuid } }
        - name: estado
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Folio, nombre o teléfono
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
                  meta: { $ref: '#/components/schemas/PaginaMeta' }

    post:
      operationId: crearPedidoPorCliente
      tags: [Panel]
      summary: Crear un pedido a nombre de un cliente (efectivo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: '#/components/schemas/CrearPedidoRequest' }, { type: object, required: [clienteId], properties: { clienteId: { type: string, format: uuid } } }] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: editarPedidoPanel
      tags: [Panel]
      summary: Editar notas, datos de entrega o propina
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [motivo], properties: { notas: { type: string, maxLength: 300, nullable: true }, destinoNombre: { type: string }, destinoTelefono: { type: string, pattern: '^[0-9]{10}$' }, destinoReferencias: { type: string, nullable: true }, propina: { type: number, minimum: 0, maximum: 500, description: Solo efectivo y sin terminar; ajusta el total }, motivo: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409':
          description: El pedido terminó o se pagó con tarjeta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/pedidos/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: soporteCancelarPedido
      tags: [Soporte]
      summary: Cancelar pedido en cualquier estado no final
      description: Si usó saldo de la cartera, se le devuelve al cliente. Con tarjeta se reembolsa a la tarjeta salvo `reembolsoA = cartera`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MotivoCancelacionRequest'
                - type: object
                  properties:
                    reembolsoA: { type: string, enum: [tarjeta, cartera], description: 'Pedido pagado con tarjeta: a dónde va el dinero (tarjeta por omisión)' }
                    cobrarCargo: { type: boolean, description: 'Efectivo con la tienda ya preparando: cargar al cliente la tarifa de cancelación' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }

  /soporte/pedidos/{id}/reembolso:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reembolsarACartera
      tags: [Soporte]
      summary: Reembolsar a la cartera del cliente (pedido entregado)
      description: Parcial o total, por ejemplo si faltó un producto. Lo absorbe PaPedir. El tope es lo que pagó el cliente menos lo ya reembolsado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto, motivo]
              properties:
                monto: { type: number, minimum: 1, example: 45 }
                motivo: { type: string, maxLength: 500, example: Faltó una bebida }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Pedido no entregado, sin cliente o REEMBOLSO_EXCEDIDO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/pedidos/{id}/completar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: soporteCompletarPedido
      tags: [Soporte]
      summary: Marcar como entregado (ej. ubicación mal capturada pero sí se entregó)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }

  /soporte/pedidos/{id}/ubicacion:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: soporteCorregirUbicacion
      tags: [Soporte]
      summary: Corregir la ubicación de destino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direccion, ubicacion, motivo]
              properties:
                direccion: { type: string }
                ubicacion: { $ref: '#/components/schemas/Coordenadas' }
                motivo: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }

  /soporte/pedidos/{id}/liberar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: soporteLiberarPedido
      tags: [Soporte]
      summary: Quitar el pedido al repartidor y regresarlo a listo_para_recoger
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /soporte/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: soporteActualizarTicket
      tags: [Soporte]
      summary: Tomar, cambiar estado o cerrar un ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoTicket' }
                asignarmelo: { type: boolean }
                atendidoPor: { type: string, format: uuid, description: 'Pasar el ticket a otra persona del equipo (soporte o admin)' }
                asunto: { type: string, maxLength: 120 }
                prioridad: { type: string, enum: [baja, normal, alta, urgente] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }

  /geo/sugerencias:
    get:
      operationId: sugerenciasDireccion
      tags: [Geo]
      summary: Sugerencias de direcciones mientras se escribe
      description: "Para autocompletar al capturar una ubicación (tiendas, direcciones de clientes, correcciones). Prioriza resultados cerca de lat/lng (por omisión, Celaya). Cualquier usuario con sesión."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 150 } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 6 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Sugerencia' } }
        '503':
          description: GEO_NO_DISPONIBLE; marcar el punto en el mapa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /geo/direccion:
    get:
      operationId: direccionDePunto
      tags: [Geo]
      summary: Dirección de un punto marcado en el mapa
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultado: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Sugerencia' }] }
        '503': { description: GEO_NO_DISPONIBLE }

  /catalogos:
    get:
      security: []
      operationId: catalogosVigentes
      tags: [Catálogos]
      summary: Categorías, motivos, documentos y versión de términos vigentes
      description: "Público. Lo edita admin; las apps lo leen en vez de tener las listas fijas."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogosPublicos' }

  /admin/catalogos:
    get:
      operationId: catalogosAdmin
      tags: [Catálogos]
      summary: Catálogos completos (incluye lo desactivado)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogos' }
    put:
      operationId: guardarCatalogos
      tags: [Catálogos]
      summary: Guardar catálogos
      description: "Los códigos que ya existen no se quitan, solo se desactivan. El motivo otro debe seguir activo. Cambiar versionTerminos obliga a todos a aceptar los términos otra vez."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Catalogos' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogos' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/usuarios/{id}/direcciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: direccionesDeCliente
      tags: [Panel]
      summary: Direcciones de un cliente
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Direccion' } }
    post:
      operationId: crearDireccionDeCliente
      tags: [Panel]
      summary: Agregar dirección a un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/usuarios/{id}/direcciones/{dir}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: dir, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editarDireccionDeCliente
      tags: [Panel]
      summary: Editar dirección de un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: borrarDireccionDeCliente
      tags: [Panel]
      summary: Borrar dirección de un cliente
      responses:
        '204': { description: Hecho }
        '404': { $ref: '#/components/responses/NotFound' }

  /soporte/usuarios/{id}/vehiculo:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: vehiculoDeRepartidor
      tags: [Panel]
      summary: Editar el vehículo de un repartidor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehiculo' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/repartidores/{id}/desconectar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: desconectarRepartidor
      tags: [Panel]
      summary: Desconectar a un repartidor
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [motivo], properties: { motivo: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: OK
        '409':
          description: Ya desconectado o con viaje activo (VIAJE_ACTIVO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/pedidos/cotizar:
    post:
      operationId: cotizarPorCliente
      tags: [Panel]
      summary: Cotizar a nombre de un cliente (efectivo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: '#/components/schemas/CotizarPedidoRequest' }, { type: object, required: [clienteId], properties: { clienteId: { type: string, format: uuid } } }] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/pedidos/{id}/asignar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: asignarPedido
      tags: [Panel]
      summary: Asignar un pedido listo a un repartidor
      description: "Solo pedidos listos para recoger y repartidores conectados. No revisa distancia; respeta el máximo de pedidos por viaje."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [repartidorId, motivo], properties: { repartidorId: { type: string, format: uuid }, motivo: { type: string } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409':
          description: REPARTIDOR_DESCONECTADO, VIAJE_LLENO, CUENTA_PENDIENTE o TRANSICION_INVALIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/pedidos/{id}/avanzar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: avanzarPedido
      tags: [Panel]
      summary: Mover el pedido al siguiente estado
      description: "programado → creado → aceptado_tienda → listo_para_recoger; asignado → en_tienda → en_camino → en_domicilio. Listo se asigna y en domicilio se completa con sus propias rutas."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [motivo], properties: { motivo: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409':
          description: TRANSICION_INVALIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/tickets:
    post:
      operationId: ticketANombre
      tags: [Panel]
      summary: Abrir un ticket a nombre de alguien
      requestBody:
        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: '#/components/schemas/TicketInput' }, { type: object, required: [usuarioId], properties: { usuarioId: { type: string, format: uuid } } }] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /soporte/tiendas/{id}/categorias:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: categoriasDeTienda
      tags: [Panel]
      summary: Categorías del menú de una tienda
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CategoriaProducto' } }
    post:
      operationId: crearCategoriaDeTienda
      tags: [Panel]
      summary: Crear categoría en el menú de una tienda
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaProductoInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaProducto' }

  /soporte/categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: editarCategoriaPanel
      tags: [Panel]
      summary: Editar categoría del menú
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaProductoInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaProducto' }
    delete:
      operationId: borrarCategoriaPanel
      tags: [Panel]
      summary: Borrar categoría del menú
      responses:
        '204': { description: Hecho }
        '409':
          description: CATEGORIA_CON_PRODUCTOS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /soporte/tiendas/{id}/productos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: productosDeTienda
      tags: [Panel]
      summary: Productos de una tienda
      responses:
        '200':
          description: OK
          content:
            application/json:
